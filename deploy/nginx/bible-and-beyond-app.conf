# Goes in /etc/nginx/snippets/. The public site itself: its files, and (from bible-and-beyond-api.conf) the
# security headers and the proxy to the ML service. Included by the HTTPS server of freestudy.bible
# (freestudy.bible.conf).

root /home/paul/bible-and-beyond.com/frontend/dist;
index index.html;

include snippets/bible-and-beyond-api.conf;

location /assets/ {
  expires 30d;
  add_header Cache-Control "public, immutable";
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # Always HTTPS (a year); and no other site may show this one inside a frame (to trick clicks on its forms).
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
}

# The page itself (every address on the site is served by it) must be checked again each time it is
# opened, so a new release is picked up on the next visit or reload. Without this a browser may keep
# showing an old copy. The browser still gets a quick "not modified" when nothing has changed. Its scripts
# and styles have a new name in every release, so /assets/ above can be kept for a month.
# (add_header in a location replaces the server's, so the security headers are repeated.)
location = /index.html {
  add_header Cache-Control "no-cache";
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # Always HTTPS (a year); and no other site may show this one inside a frame (to trick clicks on its forms).
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
}

# Captions (.vtt) as text/vtt: the stock MIME list lacks them, and Firefox shows no captions served otherwise.
# A types block here replaces the list only for these files; no add_header, so the server's headers still apply.
location ~* \.vtt$ {
  types { text/vtt vtt; }
  try_files $uri =404;
}

# Each public page has its own copy of index.html in pages/ (its title, description and a paragraph, for search
# engines; frontend/scripts/make-page-files.mjs), served at its address; any other address gets index.html. The page
# copies are checked again on each visit, like index.html. ($uri is normalised by nginx, so it cannot leave root.)
location / {
  try_files $uri @page;
}

location @page {
  try_files /pages$uri.html /index.html;
  add_header Cache-Control "no-cache";
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # Always HTTPS (a year); and no other site may show this one inside a frame (to trick clicks on its forms).
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
}
