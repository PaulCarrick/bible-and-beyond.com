# Goes in /etc/nginx/sites-available/freestudy.bible. install-system-config.sh links it into sites-enabled/
# only once its certificate exists (nginx will not start with a missing certificate file); until then
# freestudy.bible is answered by the catch-all port-80 server in bible-and-beyond.conf, which redirects to
# bible-and-beyond.com.
#
# freestudy.bible serves the same site as bible-and-beyond.com (same files, same API), under its own name.
# HTTPS certificate: bought from Namecheap, installed by hand. Files:
#   /etc/ssl/bible-and-beyond/freestudy.bible.fullchain.crt  (certificate + CA bundle)
#   /etc/ssl/private/freestudy.bible.key                     (private key, root only)

# Plain HTTP: serve certificate validation files, send everything else to HTTPS on freestudy.bible.
server {
  listen 80;
  listen [::]:80;
  server_name freestudy.bible www.freestudy.bible;

  # Certificate authorities check files here when the certificate is renewed.
  location /.well-known/pki-validation/ {
    alias /var/www/pki-validation/;
    default_type text/plain;
  }

  location / {
    return 301 https://freestudy.bible$request_uri;
  }
}

# www goes to the main address.
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name www.freestudy.bible;
  include snippets/freestudy-ssl.conf;

  return 301 https://freestudy.bible$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name freestudy.bible;
  include snippets/freestudy-ssl.conf;

  include snippets/bible-and-beyond-app.conf;
}
