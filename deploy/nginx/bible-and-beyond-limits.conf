# Goes in /etc/nginx/conf.d/ (http context).
# Searches in the licensed Bibles (NIV, NASB, The Message) each use one of the free plan's
# 5,000 monthly API.Bible requests, so they get a much tighter limit per visitor.
# An empty key is not counted, so searches in the local Bibles only use the general limit.
map $args $licensed_client {
  default "";
  "~*translations=(NIV|NASB|MSG)" $binary_remote_addr;
}

limit_req_zone $binary_remote_addr zone=api_general:10m rate=5r/s;

# The searches (the Bibles, the commentaries, the other books, everything at once) are the costly calls: a
# search for very common words can keep the database busy for seconds. A visitor searching by hand makes a
# few a minute.
limit_req_zone $binary_remote_addr zone=api_search:10m rate=30r/m;
limit_req_zone $licensed_client zone=api_licensed:10m rate=20r/m;

# Drupal's login page: slow down password guessing.
limit_req_zone $binary_remote_addr zone=cms_login:10m rate=10r/m;

# The contact form sends an email each time: a few messages a minute per visitor is plenty.
limit_req_zone $binary_remote_addr zone=api_contact:10m rate=3r/m;

# Setting up accounts, logging in, confirming an address and resetting a password: slow down password
# guessing, mass sign-ups and anyone using the site to send email.
limit_req_zone $binary_remote_addr zone=api_account:10m rate=10r/m;

# The FAQ answers come from Gemini (a paid AI service). Each FAQ answer is kept for a day, so few
# requests reach Gemini, but a visitor clicking through every question quickly is slowed down. Open
# questions (allowed accounts only) share this limit.
limit_req_zone $binary_remote_addr zone=api_faq:10m rate=10r/m;
