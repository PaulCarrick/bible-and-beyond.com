# Goes in /etc/nginx/sites-available/ and is linked into sites-enabled/.
# Drupal at https://cms.bible-and-beyond.com, with its own Namecheap certificate. Files:
#   /etc/ssl/bible-and-beyond/cms.bible-and-beyond.com.fullchain.crt  (certificate + CA bundle)
#   /etc/ssl/private/cms.bible-and-beyond.com.key                     (private key, root only)

# Plain HTTP: serve certificate validation files, send everything else to HTTPS.
server {
  listen 80;
  listen [::]:80;
  server_name cms.bible-and-beyond.com www.cms.bible-and-beyond.com;

  location /.well-known/pki-validation/ {
    alias /var/www/pki-validation/;
    default_type text/plain;
  }

  location / {
    return 301 https://cms.bible-and-beyond.com$request_uri;
  }
}

# www.cms goes to the main Drupal address.
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name www.cms.bible-and-beyond.com;
  include snippets/cms-ssl.conf;

  return 301 https://cms.bible-and-beyond.com$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name cms.bible-and-beyond.com;
  include snippets/cms-ssl.conf;

  root /home/paul/bible-and-beyond.com/drupal/web;
  index index.php;
  client_max_body_size 16m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Certificate authorities check files here to prove we control the domain.
  location /.well-known/pki-validation/ {
    alias /var/www/pki-validation/;
    default_type text/plain;
  }

  # Hidden files, Composer files, and anything inside vendor are never served.
  location ~ /\.(?!well-known) { deny all; }
  location ~ ^/(vendor|\.git)(/|$) { deny all; }
  location ~* \.(engine|inc|install|make|module|profile|po|sh|sql|theme|twig|xtmpl)$ { return 404; }
  location ~ ^/(composer\.(json|lock)|package\.json|yarn\.lock|web\.config)$ { return 404; }
  location ~ ^/sites/[^/]+/(private|settings|services)  { deny all; }

  # Uploaded files are served as plain files, never run as PHP.
  location ~ ^/sites/[^/]+/files/.*\.php$ { deny all; }
  location ~ ^/sites/[^/]+/files/styles/ { try_files $uri /index.php?$query_string; }

  # Slow down password guessing on the login page.
  location = /user/login {
    limit_req zone=cms_login burst=5 nodelay;
    limit_req_status 429;
    try_files $uri /index.php?$query_string;
  }

  location / {
    try_files $uri /index.php?$query_string;
  }

  # Only Drupal's front controller and update script run as PHP.
  location ~ ^/(index|update)\.php(/|$) {
    fastcgi_split_path_info ^(.+?\.php)(|/.*)$;
    include fastcgi_params;
    fastcgi_param HTTP_PROXY "";
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO $fastcgi_path_info;
    fastcgi_param QUERY_STRING $query_string;
    fastcgi_intercept_errors on;
    fastcgi_read_timeout 60s;
    fastcgi_pass unix:/run/php/bible-and-beyond-fpm.sock;
  }
  location ~ \.php$ { return 404; }

  location ~* \.(css|js|jpg|jpeg|png|gif|svg|ico|webp|woff2?)$ {
    try_files $uri /index.php?$query_string;
    expires 30d;
    access_log off;
  }
}
