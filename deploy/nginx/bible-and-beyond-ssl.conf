# Goes in /etc/nginx/snippets/. Shared HTTPS settings for the certificate from Namecheap (SSL.com).
ssl_certificate /etc/ssl/bible-and-beyond/bible-and-beyond.com.fullchain.crt;
ssl_certificate_key /etc/ssl/private/bible-and-beyond.com.key;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
