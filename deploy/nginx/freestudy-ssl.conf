# Goes in /etc/nginx/snippets/. HTTPS settings for freestudy.bible's certificate from Namecheap (SSL.com),
# installed by hand like bible-and-beyond.com's (see "HTTPS certificates" in CLAUDE.md).
ssl_certificate /etc/ssl/bible-and-beyond/freestudy.bible.fullchain.crt;
ssl_certificate_key /etc/ssl/private/freestudy.bible.key;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
