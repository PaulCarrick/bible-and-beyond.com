# Goes in /etc/nginx/snippets/. HTTPS settings for the Drupal site's own certificate.
ssl_certificate /etc/ssl/bible-and-beyond/cms.bible-and-beyond.com.fullchain.crt;
ssl_certificate_key /etc/ssl/private/cms.bible-and-beyond.com.key;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
