# Goes in /etc/nginx/sites-available/ and is linked into sites-enabled/.
# HTTPS certificate: bought from Namecheap, installed by hand. Files:
#   /etc/ssl/bible-and-beyond/bible-and-beyond.com.fullchain.crt  (certificate + CA bundle)
#   /etc/ssl/private/bible-and-beyond.com.key                     (private key, root only)

# Plain HTTP: serve certificate validation files, send everything else to HTTPS.
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name bible-and-beyond.com www.bible-and-beyond.com;

  # Certificate authorities check files here to prove we control the domain. The folder is
  # separate from the built site, which is wiped and rebuilt on every deploy.
  location /.well-known/pki-validation/ {
    alias /var/www/pki-validation/;
    default_type text/plain;
  }

  location / {
    return 301 https://bible-and-beyond.com$request_uri;
  }
}

# HTTPS requests for any other name, or by IP address, have no matching certificate.
server {
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server;
  ssl_reject_handshake on;
}

# www goes to the main address.
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name www.bible-and-beyond.com;
  include snippets/bible-and-beyond-ssl.conf;

  return 301 https://bible-and-beyond.com$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name bible-and-beyond.com;
  include snippets/bible-and-beyond-ssl.conf;

  root /home/paul/bible-and-beyond.com/frontend/dist;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # Always HTTPS (a year); and no other site may show this one inside a frame (to trick clicks on its forms).
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;

  # The ML service's own documentation pages list every endpoint: not shown on the live site.
  location ~ ^/api/(docs|redoc|openapi\.json)(/|$) {
    return 404;
  }

  # The searches (and Conversations, which anyone may read and search): their own, tighter limit (and the
  # licensed Bibles' monthly allowance as for any call).
  location ~ ^/api/(?<search_path>search|search-commentaries|search-other-books|search-everything|search-internet-archive|conversations)$ {
    limit_req zone=api_search burst=10 nodelay;
    limit_req zone=api_licensed burst=5 nodelay;
    limit_req_status 429;

    proxy_pass http://127.0.0.1:8000/$search_path$is_args$args;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 40s;
  }

  location = /api/contact {
    limit_req zone=api_contact burst=3 nodelay;
    limit_req_status 429;

    proxy_pass http://127.0.0.1:8000/contact;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Reading the email settings (drush) and the mail server can take a while.
    proxy_read_timeout 90s;
  }

  # Everything that can be used to guess a password or to make the server send an email (not
  # /api/account/me and /logout, which are cheap and used by every page load).
  location ~ ^/api/account/(?<account_path>register|login|verify|resend-verification|forgot-password|reset-password)$ {
    limit_req zone=api_account burst=5 nodelay;
    limit_req_status 429;

    proxy_pass http://127.0.0.1:8000/account/$account_path;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 40s;
  }

  # Stopping a devotional email from its link (no login): slow down guessing.
  location = /api/subscriptions/unsubscribe {
    limit_req zone=api_account burst=5 nodelay;
    limit_req_status 429;

    proxy_pass http://127.0.0.1:8000/subscriptions/unsubscribe$is_args$args;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Answers written by Gemini: an FAQ question (cached for a day by the ML service) or, for an account
  # an administrator allowed, the visitor's own question (not cached; the ML service also has a daily limit).
  location ~ ^/api/faq/(?<faq_path>answer|ask)$ {
    limit_req zone=api_faq burst=5 nodelay;
    limit_req_status 429;

    proxy_pass http://127.0.0.1:8000/faq/$faq_path;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Gemini can take a while to write a long answer.
    proxy_read_timeout 90s;
  }

  # A song's words file (a PDF or a picture) is shown inside the music page, so this site's own pages may frame
  # it (SAMEORIGIN), unlike everything else. add_header here replaces the server's, so the others are repeated.
  location ~ ^/api/music/(?<song_id>[a-z0-9-]+)/words$ {
    limit_req zone=api_general burst=20 nodelay;
    limit_req_status 429;

    proxy_pass http://127.0.0.1:8000/music/$song_id/words$is_args$args;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 40s;

    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
  }

  location /api/ {
    limit_req zone=api_general burst=20 nodelay;
    limit_req zone=api_licensed burst=5 nodelay;
    limit_req_status 429;

    proxy_pass http://127.0.0.1:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 40s;
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Always HTTPS (a year); and no other site may show this one inside a frame (to trick clicks on its forms).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
  }

  # The page itself (every address on the site is served by it) must be checked again each time it is
  # opened, so a new release is picked up on the next visit or reload. Without this a browser may keep
  # showing an old copy. The browser still gets a quick "not modified" when nothing has changed. Its scripts
  # and styles have a new name in every release, so /assets/ above can be kept for a month.
  # (add_header in a location replaces the server's, so the security headers are repeated.)
  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Always HTTPS (a year); and no other site may show this one inside a frame (to trick clicks on its forms).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
  }

  location / {
    try_files $uri /index.html;
  }
}
