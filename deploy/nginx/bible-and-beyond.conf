# Goes in /etc/nginx/sites-available/ and is linked into sites-enabled/.
# Certbot adds the HTTPS parts when a domain is pointed at this server.
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name test.bible-and-beyond.com bible-and-beyond.com www.bible-and-beyond.com;

  root /home/paul/bible-and-beyond.com/frontend/dist;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location /api/ {
    limit_req zone=api_general burst=20 nodelay;
    limit_req zone=api_licensed burst=5 nodelay;
    limit_req_status 429;

    proxy_pass http://127.0.0.1:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 40s;
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  location / {
    try_files $uri /index.html;
  }
}
