# Goes in /etc/nginx/sites-available/ and is linked into sites-enabled/.
# HTTPS certificate: bought from Namecheap, installed by hand. Files:
#   /etc/ssl/bible-and-beyond/bible-and-beyond.com.fullchain.crt  (certificate + CA bundle)
#   /etc/ssl/private/bible-and-beyond.com.key                     (private key, root only)

# Plain HTTP: serve certificate validation files, send everything else to HTTPS.
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name bible-and-beyond.com www.bible-and-beyond.com;

  # Certificate authorities check files here to prove we control the domain. The folder is
  # separate from the built site, which is wiped and rebuilt on every deploy.
  location /.well-known/pki-validation/ {
    alias /var/www/pki-validation/;
    default_type text/plain;
  }

  location / {
    return 301 https://bible-and-beyond.com$request_uri;
  }
}

# HTTPS requests for any other name, or by IP address, have no matching certificate.
server {
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server;
  ssl_reject_handshake on;
}

# www goes to the main address.
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name www.bible-and-beyond.com;
  include snippets/bible-and-beyond-ssl.conf;

  return 301 https://bible-and-beyond.com$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name bible-and-beyond.com;
  include snippets/bible-and-beyond-ssl.conf;

  root /home/paul/bible-and-beyond.com/frontend/dist;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location = /api/contact {
    limit_req zone=api_contact burst=3 nodelay;
    limit_req_status 429;

    proxy_pass http://127.0.0.1:8000/contact;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Reading the email settings (drush) and the mail server can take a while.
    proxy_read_timeout 90s;
  }

  # Everything that can be used to guess a password or to make the server send an email (not
  # /api/account/me and /logout, which are cheap and used by every page load).
  location ~ ^/api/account/(register|login|verify|resend-verification|forgot-password|reset-password)$ {
    limit_req zone=api_account burst=5 nodelay;
    limit_req_status 429;

    proxy_pass http://127.0.0.1:8000/account/$1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 40s;
  }

  location /api/ {
    limit_req zone=api_general burst=20 nodelay;
    limit_req zone=api_licensed burst=5 nodelay;
    limit_req_status 429;

    proxy_pass http://127.0.0.1:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 40s;
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  location / {
    try_files $uri /index.html;
  }
}
