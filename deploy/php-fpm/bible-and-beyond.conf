; Goes in /etc/php/8.4/fpm/pool.d/. Runs Drupal's PHP as paul; the default www pool is disabled.
[bible-and-beyond]
user = paul
group = paul

listen = /run/php/bible-and-beyond-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Start workers only when a request arrives, to save memory on a small server.
pm = ondemand
pm.max_children = 6
pm.process_idle_timeout = 30s
pm.max_requests = 500

php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 16M
php_admin_value[post_max_size] = 20M
catch_workers_output = yes
