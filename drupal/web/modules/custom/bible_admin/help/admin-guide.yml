# The Admin guide (/admin/guide; AdminGuideController). One section per screen of this module, in the order of the
# contents. "permissions": the section shows only to someone with one of them (none: to everyone who can open the
# guide). A picture is <img data-guide="name" alt="...">, for help/images/name.webp, taken from a local copy of
# the site with made-up people (example.org) only. Keep each section true when its screen changes, and retake its
# picture.

intro: |
  <p>How to use the pages that run this website: the Bibles, books, music and maps on the public
  site, the pictures for messages, your groups, the members' accounts and posts, the settings, and backups. Drupal's
  own pages (Content, Structure, Appearance and the like) are not covered here. Each section shows the screen as it
  looks, with made-up people; click a picture to see it full size. You see only the sections for the pages you are
  allowed to use.</p>

sections:
  - id: getting-around
    title: Getting around
    body: |
      <p>Everything is in the menu on the left, in alphabetical order. The pages of this site are Admin guide (this
      page), Backup and restore, Bibles, Christian music, Commentaries, Conversations and Prayer Wall, Devotionals,
      External sites, FAQ notes, FAQ questions, Groups, Maps, Other books, Scheduled tasks, Signatures, Site settings, Site users, Tasks and Verse a day pictures. The others (Content,
      Structure, Appearance and so on) belong to Drupal itself and are rarely needed.</p>
      <figure><img data-guide="admin-menu" alt="The Administration page: the menu on the left in alphabetical order, starting with Admin guide, and the same list in the middle with a line about each page"><figcaption>The menu, and the Administration page that lists the same pages.</figcaption></figure>
      <p><strong>Who sees what</strong> depends on the roles of your Drupal account (People, then Edit beside a name, then Roles):</p>
      <ul>
        <li><strong>Administrator</strong>: everything, Drupal included.</li>
        <li><strong>Website administrator</strong>: every page of this site, but nothing of Drupal's own. Give this to the people who run the website.</li>
        <li><strong>Bible administrator</strong>: Bibles, Commentaries, Devotionals, Other books, Christian music, Maps and Verse a day pictures, and on Site settings only the verse-window numbers.</li>
        <li><strong>Group leader</strong>: only Groups, Signatures, Tasks and Scheduled tasks, and only the ones they made (for example a deacon and the people in their care).</li>
      </ul>
      <p>To add someone, use People, then Add user: give them a user name, an email address (replies to their group
      emails go there) and a first password, tick the role, and tell them the password privately. The site cannot
      email it to them.</p>

  - id: bibles
    title: Bibles
    permissions: ['administer bibles']
    body: |
      <p>The Bibles on the public site. Only <strong>published</strong> ones appear in the reader and the search; a
      new one stays <strong>hidden</strong> until you publish it. The NIV, NASB and The Message come from API.Bible and
      are not listed here. Click a column heading to sort the list; click again to reverse it.</p>
      <figure><img data-guide="bibles" alt="The Bibles page: Upload a Bible and Site settings buttons, and a table of the Bibles with their code, name, language, licence, verses, status and a Hide button"><figcaption>The Bibles, with Hide (or Publish) and, in the arrow beside it, Delete.</figcaption></figure>
      <p><strong>To add a Bible:</strong> click <em>Upload a Bible</em>, choose its text file (the Berean tab format or
      an eBible <code>_vpl.txt</code> file), and give it a short code (such as KJV), its name, language and licence.
      The next page is a <strong>check</strong>: the format found, how many books and verses, a few sample verses and
      any warnings. Confirm to import it, or cancel. Uploading a code that is already there replaces its text and
      keeps it published or hidden as it was.</p>
      <figure><img data-guide="bible-upload" alt="Upload a Bible: the file, the code, name, language and licence, and the options"><figcaption>Upload a Bible. The check page comes next; nothing changes until you confirm.</figcaption></figure>
      <p><strong>Publish, Hide and Delete</strong> each ask first. The last published Bible cannot be hidden or
      deleted, so the site always has one.</p>

  - id: books
    title: Commentaries, Devotionals and Other books
    permissions: ['administer bibles']
    body: |
      <p>These three pages work the same way. Each lists what the public site has, with its status and how many notes,
      readings or chapters it holds.</p>
      <figure><img data-guide="commentaries" alt="The Commentaries page: Upload a commentary, and a table of the commentaries with short name, source, number of notes and status"><figcaption>Commentaries. Devotionals and Other books look the same.</figcaption></figure>
      <ul>
        <li><strong>Publish / Hide</strong>: a hidden one disappears from the public site everywhere (the lists, the
        searches, the reader) until you publish it again. Nothing is deleted.</li>
        <li><strong>Edit</strong> (in the arrow menu): change its name, author and translator, where it came from (and
        the address), its credit line and its <strong>keywords</strong> (words a visitor might search for that are not
        in the text), without uploading it again.</li>
        <li><strong>Refresh</strong>: for the ones the site knows how to fetch, downloads it again from its source in the
        background (a few minutes).</li>
        <li><strong>Delete</strong>: removes the text. Members' notes on it stay.</li>
      </ul>
      <figure><img data-guide="devotionals" alt="The Devotionals page, with the daily and chapter devotionals"><figcaption>Devotionals: daily ones (a reading for each date) and ones read chapter by chapter.</figcaption></figure>
      <figure><img data-guide="books" alt="The Other books page with its drop area and list of books"><figcaption>Other books: books read a chapter at a time, such as Wesley's sermons or the Apostles' Creed.</figcaption></figure>
      <p><strong>Kindle books</strong>, at the foot of the Devotionals and Other books pages: books read in Amazon's
      Kindle web reader, listed on the site under those pages' books, with an <em>Open in Kindle</em> button. Click
      <em>Add a Kindle book</em> and give a title, an author if you like, the <em>Kindle link</em> (open the book at
      read.amazon.com and copy the address bar; it must be an amazon.com address) and, if you like, a picture such as
      its cover (PNG, JPEG, WebP or GIF, up to 2 MB). Clear <em>Show it on the site</em> to hide one without deleting
      it. Only the link is kept: each reader opens the book with their own Amazon account, so it works for those who
      have it in their own Kindle library, and its words cannot be searched.</p>
      <figure><img data-guide="kindle-book" alt="Change a Kindle book: title, author, the Kindle link, Show it on the site, and the picture with a preview, Paste a picture and Remove the picture"><figcaption>A Kindle book, with its picture.</figcaption></figure>
      <p><strong>To upload one:</strong> click <em>Upload</em>. A <strong>PDF, Word document or EPUB ebook</strong> can be
      uploaded as it is (its headings, bold, lists and pictures are kept); a scanned PDF is read by text recognition, so
      check its words in the preview. A spreadsheet saved as tab-separated text works too, as the page explains. Give
      it an id, a name, the author and where it came from, and for a devotional whether it is <em>daily</em> or <em>by
      chapter</em>. The next page shows a <strong>preview</strong>; confirm to import it. It stays hidden until you
      publish it. Only upload text that is in the public domain or that you have permission to publish.</p>
      <figure><img data-guide="library-upload" alt="Upload a devotional: the file format explained, the PDF, Word and ebook notes, and the file field"><figcaption>Upload a devotional. The two boxes at the top explain the file formats.</figcaption></figure>
      <figure><img data-guide="library-edit" alt="Edit the details of a book: name, author, source, credit and keywords"><figcaption>Edit the details, without uploading the text again.</figcaption></figure>

  - id: music
    title: Christian music
    permissions: ['administer bibles']
    body: |
      <p>The songs and talks of the site's Christian media pages: an MP3 or MP4 file each, with the title, author,
      words and keywords. A new song is hidden until you publish it, and the media section appears on the
      site only once one is published.</p>
      <figure><img data-guide="music" alt="The Christian music page with the drop area for several files and the list of songs"><figcaption>Christian music, with the drop area for several files at once (see below) and the list.</figcaption></figure>
      <p><strong>Upload a song</strong> (or <em>Edit</em> one): the file, its title and author, keywords (words a
      visitor might search for), and the words: typed in, or taken from a PDF, Word document or ebook, and if you
      have one, <strong>the words as a PDF or picture</strong> (a scan of the hymnal page, shown below the typed
      words). To take that PDF or picture away, choose <em>Remove the PDF</em> (or <em>Remove the picture</em>) in
      the song's menu on the list, or tick <em>Remove this PDF</em> on its Edit page; the song and its typed words
      stay.</p>
      <figure><img data-guide="music-edit" alt="Edit a song: title, author, file, words, words file and keywords"><figcaption>Edit a song. A new file is optional when editing.</figcaption></figure>
      <p><strong>Add a Spotify item</strong> puts a song, album or playlist that is on Spotify in the list, instead of
      a file: in Spotify, choose Share, then Copy link, and paste it in <em>Spotify link</em>; give it an id, a title and,
      if you like, an author, keywords and words. The site shows Spotify's own player for it: visitors signed in to
      Spotify in their browser hear it in full, others hear 30-second previews. Like a song it is hidden until you
      publish it, and Search the media finds it by its title, author, keywords and words (the site cannot search
      inside Spotify). It cannot go in a visitor's playlist. The list shows its kind as Spotify, and Edit opens its own
      form. (Spotify's player for Premium accounts inside other sites needs Spotify's approval, which since 2025 is
      given only to large companies, so it is not used.)</p>

  - id: maps
    title: Maps
    permissions: ['administer bibles']
    body: |
      <p>Maps for the site's Maps pages: a picture (PNG, JPEG, WebP, GIF or TIFF) or one page of a PDF each, with a
      title, a description, where it came from, keywords and the <strong>Bible verses</strong> it goes with. A new map
      is hidden until you publish it.</p>
      <figure><img data-guide="maps" alt="The Maps page: the drop area and a table with the map's title, verses, keywords, kind, size and status"><figcaption>Maps. The link under each title is its address on the site.</figcaption></figure>
      <p><strong>Upload a map</strong> or <strong>Edit</strong>: type the verses as references separated by semicolons,
      such as <em>Acts 13:4-14; Acts 14:26</em>. If one is not understood, the map is not saved and the message says
      which. For a PDF, choose the page to show. Only upload maps that are in the public domain or that you have
      permission to publish, and put the credit in <em>Where it came from</em>.</p>
      <figure><img data-guide="map-edit" alt="Edit a map: file, page of a PDF, title, description, where it came from, keywords and verses"><figcaption>Edit a map.</figcaption></figure>
      <p><strong>Delete</strong> also removes the members' own notes, pins and routes on that map; the question
      before it says how many.</p>

  - id: several
    title: Uploading several files at once
    permissions: ['administer bibles']
    body: |
      <p>Christian music, Maps, Devotionals, Other books and Verse a day pictures have a box at the top for many files
      at once: drop them on it, or click <em>choose files</em>, then <em>Upload</em>. Each file becomes a new item
      named after the file; one whose name is already there is skipped, never replaced. Each line says how its file
      went. Tick <em>Publish them when uploaded</em> to publish them straight away; otherwise they are hidden until you
      publish them. For devotionals and books, fill in the author and where they came from first (they apply to all of
      them). Add the details of each afterwards with Edit.</p>
      <figure><img data-guide="bulk-upload" alt="The drop area: Drop song files here or choose files, Publish them when uploaded, and Upload and Clear buttons"><figcaption>The drop area (here on Christian music).</figcaption></figure>
      <p><strong>Pasting a picture you copied.</strong> Every field that uploads a picture (a Kindle book's picture, the
      site icons, a map, a song's words picture) has a <em>Paste a picture</em> box under it, and the Maps and Verse a
      day pictures boxes above have one too. Copy a picture (right-click it on a web page and choose <em>Copy Image</em>,
      or take a screenshot to the clipboard), then click <em>Paste a picture</em> (the browser may ask first), or click
      in the box and press Cmd-V (Ctrl-V on Windows). On a page with only one picture field, Cmd-V anywhere outside a
      text box does it. A preview shows what will be uploaded when you save; <em>Clear</em> takes it out. A pasted
      picture is a PNG named after the time, such as pasted-2026-11-21-143005.png (in the boxes for many files that is
      also its name on the list; change it with Edit). A large photo pasted as PNG can be bigger than the file it came
      from, so a field's size limit may refuse it: save the picture as a file and choose it instead.</p>

  - id: verse-pictures
    title: Verse a day pictures
    permissions: ['administer bibles']
    body: |
      <p>The background pictures for every picture the site makes: the <em>Send Multimedia Messages</em> verse a day
      and devotional, Verse of the day and Devotional of the day on the site, <em>Download Card</em> in the search
      results, and a group's verse cards and picture messages. One is chosen at random each time. They are not shown
      on the site on their own.</p>
      <figure><img data-guide="verse-images" alt="Verse a day pictures: the drop area and four pictures with their name, type, size, upload date and status"><figcaption>Verse a day pictures.</figcaption></figure>
      <p>Drop PNG, JPEG or WebP pictures on the box (up to 25 MB each). A picture is <strong>in use</strong> as soon
      as it is uploaded. <em>Take out of use</em> keeps it but stops it being chosen; <em>Delete</em> removes it.
      Calm pictures with space in the middle work best: the words are written over the middle in large white letters
      with a dark outline. Only upload pictures you have the right to use.</p>
      <p><strong>Changing a name:</strong> click the pencil ✎ after it. The name becomes a box with <em>Save</em> and
      <em>Cancel</em> beside it (Enter saves, Escape cancels). The id under the name stays as it is.
      <strong>Seeing a picture larger:</strong> click its thumbnail. It opens in a window over the page with its name;
      close it with × or Escape, or click outside it.</p>

  - id: groups
    title: Groups
    permissions: ['lead groups', 'administer groups']
    body: |
      <p>Groups of people you look after (the people in a deacon's care, a family, a class), and the messages you
      send them. A Group leader sees only the groups they made; a Website administrator sees all of them, with the
      leader of each.</p>
      <figure><img data-guide="groups" alt="Groups: Make a group, and a table of groups with members and last message"><figcaption>Your groups. Click a name to open it.</figcaption></figure>
      <p><strong>Make a group</strong>: give it a name (it appears in the emails), a one-line <strong>Description</strong> if you like (the title of its sign-up sheet, such as "After Church Fellowship Time - Thank you for Serving the Body"; it shows under the name on the group page) and, if you like, notes that only you
      see. You are its leader, and <strong>replies to its emails come to the email address of your Drupal
      account</strong>.</p>
      <figure><img data-guide="group" alt="A group's page: its notes, who leads it, three send buttons, the Scheduled table (a weekly message signed Formal), the members with names and addresses as links and how each gets messages, and the Sent table"><figcaption>A group's page: send, schedule, members and what was sent.</figcaption></figure>
      <h3>Members</h3>
      <p><strong>Add a member</strong> starts with <em>People with an account on the site</em>: everyone with an
      account who is not in the group yet. Tick as many as you like and click <em>Add</em>. They get your messages the
      way each chose on the site's My account page: by email, by text, or both. Someone who has not confirmed their
      email address yet gets nothing until they do; the list says so.</p>
      <figure><img data-guide="group-member-add" alt="Add a member: Who to add, with People with an account on the site chosen and a list of accounts to tick"><figcaption>Adding site accounts: tick everyone to add.</figcaption></figure>
      <p>For someone <strong>without an account</strong>, choose <em>Someone without an account</em>: their email
      address, name and (for your reference) phone appear. They get emails only, never texts, as nobody has their
      agreement to texts. <em>Add and add another</em> keeps the form open for the next person. On the group's page,
      <em>Edit</em> changes such a person's details, and <em>Remove</em> takes anyone out of the group (their account,
      if any, stays).</p>
      <p>In the members list, the <strong>name</strong> of someone with an account opens their entry on Site users
      (only for those who may use Site users; a Group leader sees the name only). Click a member's <strong>email
      address</strong> to write to that person alone: a box opens with a <strong>Subject</strong> (it starts as "A
      message from <em>you</em> (<em>the group</em>)"; type your own) and an editor (headings, bold, italic, underline,
      strikethrough, links, lists and quotations). <em>Send</em> emails it to them only, addressed openly to them (their
      address is the To; there is no Bcc), with replies coming to your address; <em>Cancel</em> closes the box and
      sends nothing. It goes by email even to someone who chose texts. It is not a group email, so it carries only
      your words: no "Sent by … to the group" line and no stop link at the foot. It cannot go to someone who stopped the group's messages or has not
      confirmed their address (their address is not a link then). The Sent table lists it as "to one member".
      <strong>Send at</strong> is now to begin with: leave it to send at once, or choose a later date and time (in
      your own time zone) and press <em>Send</em> to have it go then. A message waiting to go is in the group's
      <em>Scheduled</em> list as "Message to … only", where <em>Remove</em> stops it before its time; to change it,
      remove it and write it again. <strong>Signature</strong> adds one of your signatures (from the Signatures page)
      after your message, sent now or at its Send at time; it starts as "No signature".</p>
      <figure><img data-guide="group-member-email" alt="Email Ruth Example: To Ruth Example only, by email, the subject, the message in the editor, the Signature Formal, Send at now, and Send and Cancel"><figcaption>Writing to one member: the box opens over the group's page.</figcaption></figure>
      <figure><img data-guide="group-member-contact" alt="Add a member with Someone without an account chosen: email, name and phone"><figcaption>Adding someone without an account.</figcaption></figure>
      <h3>Sending</h3>
      <p>Every message goes to each member separately, showing <strong>only your address</strong> as the one it is
      to, so no member sees anyone else's address. Each email has a link that stops that person's messages from this
      group (other groups are not affected). You get one copy of each, which says how many it reached. The page then
      says how many were emailed and texted, and the <em>Sent</em> table keeps a record.</p>
      <p><strong>View</strong> at the end of a row in the <em>Sent</em> table shows a copy of that email as it went
      out: who it was from, the address it was to (yours), where replies go, every address it was emailed to as a
      hidden recipient (Bcc), the subject, and the email itself, with its formatting and picture (and its plain-text
      copy under it). Each member's stop links carry their own code, so the copy shows MEMBER-STOP-CODE there
      instead; those links stop nothing. Emails sent before November 18, 2026 have no copy, so their rows have no
      View.</p>
      <ul>
        <li><strong>Send a message</strong>: a subject and your words, written in the editor (headings, bold,
        italic, underline, strikethrough, a font, size, text colour and highlight, links, lists and quotations), which
        the email keeps. A text is a short version with the words only. <em>Add one of your verse cards</em> lists
        the cards on My cards of your own account on the site (made with Make your own card on the Verse of the day
        page); one chosen is shown in the email, attached to it as a picture to save, and sent as a picture text to
        members who get texts. Your admin account finds your site account by its email address, or by the
        <em>Drupal administrator account</em> chosen on your Site users entry. A scheduled message and Email a
        member offer the same choice. A <strong>Signature</strong> (one of the leader's, from the Signatures page)
        can be added to a message, verse card or picture message sent now, as on scheduled emails; it goes after the
        words and before the "Sent by …" line. A scheduled message keeps its card (it goes without it if the card is deleted
        from My cards first), and the Scheduled list says "with a verse card". A scheduled message, Email a
        member, the group's notes, signatures and tasks use the same editor; the words for a picture stay plain, as
        they are written onto the picture.</li>
        <li><strong>Send a verse card</strong>: a well-known Bible verse chosen at random, written over one of the
        verse a day pictures. Not the one you want? <em>Pick another verse</em>. In the email the verse is a link to it
        on the site; members who get texts get it as a picture message.</li>
        <li><strong>Send a picture message</strong>: your own words (up to 400 characters) written over a random
        picture. Click <em>Make the picture</em> to see it first, <em>Make another picture</em> for a different one, then
        send.</li>
      </ul>
      <figure><img data-guide="group-send-message" alt="Send a message: the subject, the message in the editor with bold, a red word, a line in Georgia in dark blue and a list, and the Font, Size, Colour and Highlight buttons"><figcaption>Send a message. The button says how many it goes to.</figcaption></figure>
      <figure><img data-guide="group-send-verse" alt="Send a verse card: the card shown, with Pick another verse and Send"><figcaption>Send a verse card.</figcaption></figure>
      <figure><img data-guide="group-send-picture" alt="Send a picture message: subject, words, the picture made, Make another picture and Send"><figcaption>Send a picture message, after Make the picture.</figcaption></figure>
      <h3>Scheduled emails</h3>
      <p><strong>Add a scheduled email</strong> sends a message, a verse card (a new random verse each time) or a
      picture message (your words on a new picture each time) by itself, at a time you choose:</p>
      <ul>
        <li>once, on a date;</li>
        <li>every week, on a day of the week;</li>
        <li>every month, on a day of the month (29, 30 or 31 means the last day in a shorter month);</li>
        <li>every month, on the first, second, third, fourth or last of a weekday (such as the first Monday).</li>
      </ul>
      <p><strong>Signature</strong>: each scheduled email can have one of your signatures (from the Signatures page),
      or none. It goes after the words of every email the schedule sends, before the stop links, and in Send a test.
      The group page shows it beside the scheduled email ("signed …"). Deleting a signature leaves the scheduled
      emails that used it with none.</p>
      <p>Choose the time and the time zone (yours, to start). It goes within five minutes of that time. The
      <em>Scheduled</em> table shows when each goes next and how the last one went, with <em>Edit</em> and
      <em>Remove</em>. A one-time email shows <em>Done</em> once it has gone.</p>
      <p><strong>Send a test</strong> (in the same menu, after <em>Remove</em>) emails it now to the group's leader
      only, so you can see how it looks. It is exactly what each member gets: the same subject, words and stop links
      at the foot (the links in your test belong to no one, so they stop nothing). Members get nothing, nothing is
      texted, and it still goes to the group at its time. A verse card or picture message is chosen at random each
      time, so the test shows one example.</p>
      <p><strong>Stopping a scheduled email</strong>: each scheduled email has two more links at its foot, besides the
      one that stops everything from the group. <em>Stop this scheduled email</em> stops only that one for that
      person; <em>Stop all scheduled emails from this group</em> stops every scheduled email of this group for them,
      including ones you add later. Neither takes them out of the group: they still get what you send by hand, and
      other groups are not affected. The Scheduled table says how many members stopped each one, and the members
      list says what each person stopped. If someone asks to have them back, choose <em>Start scheduled emails
      again</em> in their menu on the right (it asks first): they get every scheduled email again. It does not undo
      the link that stops everything from the group.</p>
      <figure><img data-guide="group-schedule" alt="Add a scheduled email: a message chosen, its subject and words in the editor, When: every week on Tuesday, the time and the time zone, and the Signature Formal"><figcaption>Add a scheduled email. The fields change with your choices.</figcaption></figure>
      <h3>Changing the group or its leader</h3>
      <p><em>Change the group</em> changes its name and notes. A Website administrator also sees a
      <strong>Leader</strong> list there (or follows <em>Change the leader</em> on the group's page) to give the group to
      someone else who can lead groups; it then belongs to them, and replies go to their address. <em>Delete the
      group</em> removes it with its members and record (their site accounts stay).</p>
      <figure><img data-guide="group-edit" alt="Change a group: name, Leader and the notes in the editor"><figcaption>Change the group, as a Website administrator sees it (with Leader).</figcaption></figure>
      <p>Members can also send a <strong>prayer request</strong> to their group, or to its leader only, from the
      Prayer Wall. It arrives with their name; replying answers them. Such requests show in the Sent table as
      <em>Prayer Wall</em>, with the subject only.</p>

  - id: conversations
    title: Conversations and Prayer Wall
    permissions: ['administer site users']
    body: |
      <p>Every post on the public site's Conversations and Prayer Wall pages, newest first, with a search (title,
      text, author's name or address) and <em>Show</em> to see one of the two. The <em>Where</em> column says which, and
      for a prayer request whether it is private, anonymous, on the prayer list email or answered; a Conversations
      post a member sent to one other member says "private, to Name (address) only". Here you always see
      the real author, even of an anonymous request.</p>
      <figure><img data-guide="conversations" alt="Conversations and Prayer Wall: search, Show, and a table of posts with their beginning, author, where, dates and replies"><figcaption>Conversations and Prayer Wall.</figcaption></figure>
      <p><strong>Read and delete</strong> shows the whole post with its replies. Delete a reply with the link under it,
      or the whole post (with its replies) with the button; both ask first. The author is not told.</p>
      <figure><img data-guide="conversation-post" alt="A post with its replies and the delete buttons"><figcaption>One post, with its replies.</figcaption></figure>
      <p>Who may write is set per member on Site users (<em>Conversations</em>); anyone may read. Those with
      <em>Get Conversation Posts</em> ticked on Site users are emailed every new post and reply.</p>

  - id: external-sites
    title: External sites
    permissions: ['use external sites']
    body: |
      <p>Other sites you use, such as the <strong>Kindle web reader</strong> (https://read.amazon.com), in one shared
      list. <strong>Add a site</strong> takes a name, its address (only web addresses starting with https:// or
      http://) and notes; Edit and Delete are in each site's Operations (deleting only takes it off this list).</p>
      <p><strong>Open</strong> opens the site in its own window beside the admin page. Sign in there the first time:
      it stays signed in like any other tab. A site such as Amazon cannot be shown inside the admin page itself: it
      refuses, to protect its sign-in, and a site shown inside another one is kept signed out by the browser. If your
      browser blocks the window, the site opens in a new tab instead.</p>
      <p>This page cannot see whether you are signed in to another site. If the site has signed you out, sign in again
      in its window. For a site that does not show its own Sign in, fill in its <strong>Sign-in address</strong>: the
      list then has a <strong>Sign in</strong> button beside Open, which opens that page in the same window. The
      Kindle reader shows its own Sign in, so it needs none. Never put a password in the address or the notes.</p>
      <p><strong>On the site</strong>: a site with <strong>Show it in the site's sidebar</strong> ticked (the box starts
      ticked) is listed for visitors under <em>External sites</em> in the site's sidebar, as its name and a link that
      opens in a new tab. Visitors never see the notes or the sign-in address. The group appears only when at least one
      site is shown; clear the box for a site that is only for you. The list's <em>Sidebar</em> column says which are
      shown.</p>
      <figure><img data-guide="external-sites" alt="External sites: Add a site, and a table of two sites, one with Open and Sign in buttons and the Kindle reader with Open, each with its site and notes"><figcaption>External sites: Open opens each in its own window.</figcaption></figure>

  - id: faq-questions
    title: FAQ questions
    permissions: ['administer faq notes']
    body: |
      <p>The questions visitors can choose on the FAQ page, in order under their headings. Until you change one, a
      site shows the questions built into Bible and Beyond; your first change makes the list the site's own.</p>
      <ul>
        <li><strong>Add a question</strong>: choose its heading (or <em>A new heading…</em>) and write it as visitors
        will see it. The AI answers it the first time someone opens it and keeps the answer for a month.</li>
        <li><strong>Edit</strong>: reword it or move it under another heading (it goes last there). A reworded question
        gets a new answer, and its note moves with it.</li>
        <li><strong>Up</strong> and <strong>Down</strong> move a question within its heading; <strong>Delete</strong>
        takes it off the FAQ (its note stays on FAQ notes, not shown).</li>
        <li><strong>About this site</strong>: a few sentences on who the site is for, sent to the AI with every
        question so its answers fit your readers (for a Celebrate Recovery site: people in Christ-centred recovery).
        Only the plain words are sent.</li>
        <li><strong>Go back to the built-in questions</strong> replaces the site's own list (asks first).</li>
      </ul>
      <figure><img data-guide="faq-questions" alt="FAQ questions: Add a question, About this site, then the built-in questions under their headings, each with Up or Down and a menu with Edit and Delete"><figcaption>FAQ questions, under their headings.</figcaption></figure>

  - id: faq-notes
    title: FAQ notes
    permissions: ['administer faq notes']
    body: |
      <p>Your own notes, shown in a box under the AI's answer on the FAQ page, one note per question.</p>
      <figure><img data-guide="faq-notes" alt="FAQ notes: Add a note, and a table of questions with the start of each note"><figcaption>FAQ notes.</figcaption></figure>
      <p><strong>Add a note</strong> (or Edit): choose the question (those with a note already are left out) and write
      the note in the editor: headings, bold, italic, underline, superscript (for verse numbers), a font, size, text
      colour and highlight, links, lists and quotations. A link can go to a verse on the site (copy its address from the Bible reader), another FAQ answer,
      a page of the site, or another website. Links to a verse or another website open in a new tab.</p>
      <figure><img data-guide="faq-note-edit" alt="Edit a FAQ note: the question and the note in the editor, whose toolbar has the Font, Size, Colour and Highlight buttons"><figcaption>Edit a FAQ note.</figcaption></figure>

  - id: signatures
    title: Signatures
    permissions: ['keep signatures and tasks', 'administer signatures and tasks']
    body: |
      <p>Your email signatures: each has a name, for you to tell them apart, and the signature itself, written in the
      same editor as the group emails (bold, italic, links, lists and so on). Only you see your signatures; a Website
      administrator sees everyone's, with an Owner column. Choose one for each scheduled email of a group (see
      Groups, Add a scheduled email), for Email a member, and for each task's reminder emails (see Tasks).</p>
      <figure><img data-guide="signatures" alt="Signatures: Add a signature, and a table of two signatures, Formal and Short, with their owner, the start of each and when it was last changed"><figcaption>Signatures.</figcaption></figure>
      <p><strong>Add a signature</strong>, or Edit or Delete one from its Operations. Deleting asks first. The editor
      has the Font, Size, Colour and Highlight buttons, so a name can be in Georgia or a script font, for example.</p>
      <p>A signature or task belongs to the Drupal account that made it, and a task offers only its owner's
      signatures. A Website administrator sees an <strong>Owner</strong> list on both forms to give one to someone
      else (for example one made while logged in as a different account). A task moved to someone sends its reminders
      in their name, with replies to their address.</p>
      <figure><img data-guide="signature-edit" alt="Change a signature: the name Formal and the signature in the editor, the name in Georgia and dark blue"><figcaption>A signature in the editor.</figcaption></figure>

  - id: tasks
    title: Tasks
    permissions: ['keep signatures and tasks', 'administer signatures and tasks']
    body: |
      <p>Things that come round again: each task has a name, a description, how often it comes round and the words of
      a first and a second notification. Only you see your tasks; a Website administrator sees everyone's, with an
      Owner column. The list shows how often each comes round and its next date.</p>
      <figure><img data-guide="tasks" alt="Tasks: Add a task, and a table of Communion (every month on the first Sunday), Greeter (every week on Sunday) and Set up the room (every two weeks on Thursday), each with its next date, and Schedule, Edit and Delete"><figcaption>Tasks.</figcaption></figure>
      <p><strong>Add a task</strong> (or Edit) and choose how often (below). Under <em>Group and sign-up sheet</em>,
      <strong>Group</strong> is the group the task is for: only that group's sign-up sheet lists it, and only its
      members can ask for it on the site (with no group it is on no sheet and offered to no one; the Tasks list has a
      Group column). <strong>Expected occurrences</strong> is how many people the task needs on each date (2 gives "Baked Goods 1" and
      "Baked Goods 2" on the sheet, and members cannot ask for a date that already has that many), and
      <strong>Order on the sign-up sheet</strong> is where it comes within a date (lowest first).</p>
      <p>How often:</p>
      <ul>
        <li><strong>Weekly</strong>: every week, or every 2 to 8 weeks, on one or more days of the week (every week on
        Sunday and Wednesday; every 3 weeks on Thursday).</li>
        <li><strong>Monthly, on a day of the month</strong>: the 1st to the 31st (the 29th, 30th and 31st mean the last
        day in shorter months).</li>
        <li><strong>Monthly, on a weekday</strong>: the first, second, third, fourth or last (tick one or more) of one
        or more days of the week. Communion on the first Sunday is <em>First</em> and <em>Sunday</em>; the first and
        third Sunday is <em>First</em>, <em>Third</em> and <em>Sunday</em>.</li>
      </ul>
      <p>For both monthly choices, <strong>How many months apart</strong> is every month, every 2, 3 (quarterly), 4 or
      6 months, or <strong>once a year</strong>. <strong>Starting</strong> is the first date that can count: every few
      weeks or months counts from its week or month, and a task once a year comes in its month (the last Thursday of
      November: Starting in November, once a year, Last, Thursday).</p>
      <p>The description and the two notifications are written in the editor. Under each notification, <strong>Days
      before</strong> says when it is sent to the person a date is scheduled for: for example 7 for a week before
      and 1 for the day before (0 is the day itself). The second needs fewer days than the first. It goes at 8:00 AM
      in your time zone (the one on your Drupal account), and replies come to your email address. Leave Days before
      empty to send nothing for that notification.</p>
      <p>Each reminder goes the way the person chose on their My account page: by email (to a confirmed address), by
      text, or both. If a text cannot be sent, someone who chose texts only gets it by email instead (when their
      address is confirmed). The <strong>Signature</strong> you choose on the task (one of yours, or none) goes at the
      foot of its reminder emails, not texts. In the notifications, <strong>[FIRST_NAME]</strong>, <strong>[LAST_NAME]</strong> and
      <strong>[FULL_NAME]</strong> are replaced with the person's name, for example "Hi [FIRST_NAME]," (an account with
      no name reads "friend").</p>
      <figure><img data-guide="task-edit" alt="Change a task: Communion, its description, How often: monthly on a weekday, every month, First and Sunday ticked, starting November 1, and the first and second notifications, 7 and 1 days before"><figcaption>Communion: every month on the first Sunday, with two reminders.</figcaption></figure>

  - id: scheduled-tasks
    title: Scheduled tasks
    permissions: ['keep signatures and tasks', 'administer signatures and tasks']
    body: |
      <p>Who does which task on which date. On the Tasks page, choose <strong>Schedule</strong> beside a task, then
      pick the <strong>site user</strong> and the <strong>date</strong>: the list holds the task's next date and the
      three after it (for a task every week on Sunday, the next four Sundays). Then Schedule. The same person cannot
      have the same task twice on one date. To fill a whole day at once, press <strong>Schedule tasks</strong> at the top
      of the Scheduled tasks page: choose the <strong>Date</strong>; the tasks that fall on it are listed (with who has
      each already). Press <strong>+</strong> beside a task to add a row for it, and again for another person on the same
      task; choose the <strong>site user</strong> in each row (and a note if you like), or press <strong>−</strong> to
      remove a row, then
      <strong>Schedule</strong>. They are all saved together, or none if one has a problem. The <strong>Note</strong> is optional: words for this person on this date,
      added under the notification in each of their reminders (the name fields work in it too).
      <strong>Confirmed</strong>: a new scheduled task starts unconfirmed; tick <em>Confirmed</em> on its Edit page once
      it is settled (for example when the person has said they will do it). The list's <em>Confirmed</em> column says
      Yes or No, and a click on its header sorts by it; the Scheduled Task Report has a Confirmed column too. On the
      public site, a member who is in at least one group (as a site account) finds <em>My scheduled tasks</em> in the
      account menu (asking only for tasks whose Group is one of theirs): their
      tasks from today on (and the last 60 days under Earlier), each with its date, Confirmed or Not confirmed yet,
      the task's description and their note. There they can <strong>ask for a task</strong> (Add a task: one of
      the tasks of their group leader, on one of its dates in the next two months) and <strong>take themselves off</strong>
      a coming one (Remove). Either way the group leader is emailed (with the member's address as Reply-To); a request
      arrives here unconfirmed, with "(on the site)" after their name under Scheduled by. When you tick
      <em>Confirmed</em> on a task that was not confirmed, the member is emailed that they are confirmed (or texted,
      if that is how they chose to get messages), and the page says how they were told.</p>
      <figure><img data-guide="schedule-tasks" alt="Schedule tasks: the date Sunday, December 6, the tasks that fall on it (Communion and Greeter) with who has each already and a + button, and a row for Greeter with the site user Mary Sample, a note box and a − button"><figcaption>Schedule tasks: several tasks on one date at once.</figcaption></figure>
      <figure><img data-guide="task-schedule" alt="Schedule a task: Communion, every month on the first Sunday, the site user Daniel Example and the date, the next first Sunday"><figcaption>Schedule: the person and one of the next four dates.</figcaption></figure>
      <p>The <strong>Scheduled tasks</strong> page lists them by date from today on, with the past ones folded away
      under <em>Past</em>; click <em>Date</em>, <em>Task</em> or <em>Site user</em> at the top of a column to sort by it
      (click again to reverse). <strong>Edit</strong> changes the person, the date or the note (a date already passed stays in the
      list as "its date now"); <strong>Remove</strong> takes away that date for that person and keeps the task.
      Deleting a task, or a site user's account, removes its scheduled dates. You see the scheduled dates of your own
      tasks; a Website administrator sees all of them.</p>
      <p>The <strong>Reminders</strong> column shows the day each reminder goes and how it went: Sent by email, by
      text or both, not sent yet, or why it was not sent (for example an email address not confirmed yet). A reminder goes once. If you schedule a
      date after its first reminder's day, the first goes at once; if the second is due by then too, only the second
      goes.</p>
      <p>A task never sends one person two reminders on the same day: if the first is late and the second is
      due later that day, only the second goes. Nothing goes once the date has passed. Changing the person or the date lets the reminders go again.</p>
      <p><strong>Message a day</strong> (the third button) writes to everyone scheduled on one date: choose the
      <strong>Date</strong> from the list, untick anyone to leave out (everyone starts ticked), give a
      <strong>Subject</strong>, write the <strong>Message</strong> (the name fields work here too) and choose a
      <strong>Signature</strong>, then <strong>Send</strong>. <strong>Attachments</strong> (up to 5 files, 10 MB
      together: PDF, pictures, Word, Excel, PowerPoint or plain text; or paste a copied picture) go with each email; a
      text gets the first picture and a link to download the files for 30 days. Untick <strong>Add the “Sent by …” line at
      the foot</strong> to end the email with your own words; the same box is on a group's Send forms, its scheduled
      emails and each task (for its reminders). A group email keeps each member's stop links either way. Each person gets it the way they chose
      (email, text or both), and replies come to your email address. The page then says who it reached, and why anyone was not.</p>
      <figure><img data-guide="day-message" alt="Message a day: the date with three people, each ticked with their task, the subject About Sunday, December 6, the message in the editor with Hi [FIRST_NAME], Attachments with Paste a picture, the Signature Formal and the Sent by tick box"><figcaption>Message a day.</figcaption></figure>
      <p>The <strong>Scheduled Task Report</strong> (the button beside Schedule tasks) lists them day by day, like a
      sign-up sheet: choose <em>From</em>, <em>To</em> and, if you like, a <em>Group</em> (one group's tasks, or the
      tasks with no group; All groups to start) and press <em>Show</em>; each day with something scheduled has its
      own heading and a table of the task, the person's name, the note, their email and their phone. <em>Print</em>
      prints just the report.</p>
      <p>The <strong>Sign-up sheet</strong> button makes a PDF to print and put out, like a paper sign-up sheet: choose
      the <strong>Group</strong> (the sheet lists the tasks whose Group is that group), <strong>From</strong> and
      <strong>To</strong> and, if you like, <strong>Notes</strong>
      for the foot (shown with no heading, and left off when empty), then <em>Make the PDF</em>. Each date on which
      any of the tasks falls gets a block with a row for each place: a task that expects two people (its
      <em>Expected occurrences</em>) has two rows, "Baked Goods 1" and "Baked Goods 2". With <em>Fill in the people
      scheduled</em> ticked the rows show who is scheduled, with their note, email and phone (and "not confirmed"
      when they are not yet), then blank rows up to the number expected; unticked, the sheet is blank. The title at the
      top of each page is the group's <strong>Description</strong> (set on the group's Edit page; its name when it has
      none). Tick <strong>Save this note</strong> to have the notes come up again next time you make that group's
      sheet; unticked, they go on that PDF only. Saved notes belong to the sign-up sheet of that group, not to other
      reports.</p>
      <figure><img data-guide="task-report" alt="Scheduled Task Report: From and To dates, Show, Print, and Sunday, December 6 with a table of Communion and Greeter: name, notes, email and phone"><figcaption>The Scheduled Task Report.</figcaption></figure>
      <figure><img data-guide="scheduled-tasks" alt="Scheduled tasks: Greeter for Daniel Example and Communion for Ruth Example, with the Reminders column: Communion's first reminder Sent and its second not sent yet"><figcaption>Scheduled tasks, with how each reminder went.</figcaption></figure>

  - id: site-users
    title: Site users
    permissions: ['administer site users']
    body: |
      <p>The accounts of the public site's visitors (not the people who use these admin pages). By name, A to Z
      (click <em>Name</em> or <em>Email</em> at the top of the column to sort by it; again to reverse), 50 a page, with a search on the address or name, and for each its phone, whether the address is confirmed, what it is
      allowed and how many notes it has.</p>
      <figure><img data-guide="site-users" alt="Site users: search, Add a site user, and a table of accounts with their address (or none, for one that logs in with its phone), name, phone and flags"><figcaption>Site users.</figcaption></figure>
      <p><strong>Add a site user</strong> or <strong>Edit</strong>:</p>
      <ul>
        <li>The email address (they log in with it), names and phone. Changing the phone turns their text messages off,
        unless <em>Texts on</em> is ticked.</li>
        <li><strong>Texts on (they agreed to get text messages)</strong>: their notices also go by text, as Send via SMS
        on their My account page does. Tick it only when the member has told you they want texts (carriers require
        their agreement); the phone must be a US or Canadian cell number, and turning it on texts them a welcome
        message saying how to stop. If they replied STOP, the form says so: turn it on again only if they asked.</li>
        <li><strong>An email address or a phone number</strong> (or both) is needed. With no email address the
        account logs in with its phone, which must be a US or Canadian cell number, and it is never emailed (the list
        shows "(none: logs in with phone)"). Members can set up such an account themselves on the site; a texted
        code confirms the number.</li>
        <li><em>Email address confirmed</em>: the daily emails and texts go only to a confirmed address. Tick it only
        if you know the address is theirs.</li>
        <li><em>Phone number confirmed</em> (shown when there is no email address): the same for an account that
        logs in with its phone. Texts go only to a confirmed number. Tick it only if you know the number is
        theirs.</li>
        <li>The search box finds accounts by address, name, or the digits of their phone.</li>
        <li><em>Open AI queries</em> (their own questions on the FAQ page), <em>Conversations</em> (writing on
        Conversations and the Prayer Wall), <em>Maps</em> (their own notes, pins and routes) and <em>Can share
        lists</em> (putting their lists on the Public lists page under Members, where everyone sees them; unticking
        it hides their shared lists): off unless ticked here.</li>
        <li><em>Get Conversation Posts</em>: emails them every new post and every new reply in Conversations (not
        the Prayer Wall), except their own. It needs a confirmed email address, and each email has a link that turns
        it off again (the box is then unticked here). The list's <em>Gets posts</em> column shows who has it.</li>
        <li><em>Drupal administrator account</em> (Edit only): the admin account of the same person, when the two have
        different email addresses. Their saved verse cards (My cards) are then offered on a group's Send a message.
        With none chosen, an admin account is matched to the site account with its email address.</li>
        <li><em>Gets private prayer requests</em>: for the site's own administrators, whose weekly prayer list email
        then holds the private requests too.</li>
        <li>A password, twice (8 to 128 characters). Left empty when editing, it stays as it is; a new one logs them
        out everywhere. The site cannot email it: tell them privately.</li>
      </ul>
      <figure><img data-guide="site-user-edit" alt="Edit a site user who logs in with a phone: no address, names, the phone, Phone number confirmed ticked, the other checkboxes, Account closed and the password"><figcaption>Edit a site user: here one with no email address, who logs in with their phone.</figcaption></figure>
      <p><strong>Delete</strong> asks first, and says how many notes and daily emails go with the account.</p>
      <p><strong>Closed accounts.</strong> A member can close their own account on My account (<em>Close my
      account</em>, with their password). Nothing is deleted, but it can no longer log in, and after one email saying
      it was closed the site sends it no more emails or texts (no devotionals, verse a day, prayer list, replies or
      group messages; in a group it shows "Nothing: they closed their account"). The list shows "(closed)" after its
      address. To reopen it, edit it and untick <em>Account closed</em>; to remove it with everything in it, use
      <strong>Delete</strong>. Ticking <em>Account closed</em> yourself closes an account without any email.</p>

  - id: site-settings
    title: Site settings
    permissions: ['administer bibles', 'administer site settings']
    body: |
      <p>The options of the public site, on one screen; <em>Save configuration</em> at the bottom. A Bible
      administrator sees only the verse-window numbers.</p>
      <figure><img data-guide="site-settings-1" alt="The site: title, copyright line, header emblem and browser-tab icon"><figcaption><em>The site</em>: the title (top of every page), the copyright line (the footer), and the two icons.</figcaption></figure>
      <p><strong>The site</strong>: the <em>Title</em> beside the emblem at the top of every page, the
      <em>Copyright</em> line at the foot, the <em>Welcome paragraph</em> (the opening words of the Welcome page,
      in the editor, so it can have links and formatting), <em>Login required</em>, <em>Check posts with AI</em>, and the <em>Header emblem</em> and <em>Browser-tab icon</em>: upload a
      picture to replace one, or <em>Go back to the site's own icon</em>.</p>
      <p><strong>Login required</strong> (off unless ticked): visitors who are not logged in see only the log-in and
      password pages, and nothing else on the site works for them. The <em>Set up account</em> links are gone and
      visitors cannot set up their own accounts: add people on <em>Site users</em> (Add site user). The log-in page
      instead has <em>No account yet? Email us to ask for one</em>, which writes to the <em>Contact email to</em>
      address of the Email server settings (so anyone who opens the log-in page can see that address).</p>
      <p><strong>Check posts with AI</strong> (off unless ticked): every new or changed post and reply on
      Conversations and the Prayer Wall is first sent to Google Gemini (with the Gemini key further down). One it finds
      inappropriate (profanity, political messages, advertising, or anything else unfit for the site) is not saved, and
      the member is told why and asked to change it. Prayers for leaders or a nation, and mentions of a church,
      ministry or Christian book, are allowed. If Gemini cannot be reached or is too busy, the post is accepted
      unchecked, so the boards keep working.</p>
      <figure><img data-guide="site-settings-4" alt="Show in Context: verses before and after"><figcaption><em>Show in Context</em>: how many verses before and after.</figcaption></figure>
      <figure><img data-guide="site-settings-5" alt="Related Verses: how many to show"><figcaption><em>Related Verses</em>: how many cross references to list.</figcaption></figure>
      <p><strong>Email server</strong>: what the site sends its email through (the contact form, account links, the
      daily emails, group messages): the server, port, user name and password, and the contact form's addresses and
      subject. The password is never shown: leave it empty to keep it, or type a new one.</p>
      <figure><img data-guide="site-settings-6" alt="Email server: host, port, user name, password, authentication, domain, From and To addresses and subject"><figcaption><em>Email server</em> (made-up values).</figcaption></figure>
      <p><strong>Keys of outside services</strong>: Google Gemini (the FAQ answers), API.Bible (the NIV, NASB and The
      Message), Google reCAPTCHA (the contact form), <strong>Telnyx</strong> (text messages: the key, the number texts
      come from and the public key) and the folder the song files are kept in. A saved key is never shown again:
      leave its box empty to keep it.</p>
      <figure><img data-guide="site-settings-10" alt="Telnyx: API key, number and public key"><figcaption><em>Telnyx</em>, for text messages.</figcaption></figure>

  - id: backup
    title: Backup and restore
    permissions: ['administer backups']
    body: |
      <p>A copy of the whole site in up to three zip files, saved on your own computer. Tick what to include:
      <em>Database</em> gives two zips, the Bible database (the Bibles, books, songs' details, members' accounts,
      notes and groups, the settings and the service keys) and Drupal's own database; <em>Files</em> gives one
      (the song files, maps, pictures and Drupal's uploads). The three share a name, such as
      bible-and-beyond-2026-11-21-184451-bible-database.zip, -drupal-database.zip and -files.zip. They hold
      members' details and the keys: keep them private.</p>
      <figure><img data-guide="backup" alt="Backup and restore: what to include, a note, Back up to a folder, and Restore from a backup zip"><figcaption>Backup and restore.</figcaption></figure>
      <p><strong>Back up to a folder…</strong> (add a note first if you like, such as "Before the move") builds
      the zips on the server, then asks for a folder and saves them there one after another (in Chrome and Edge;
      other browsers download them to your Downloads folder). Each zip is deleted from the server as soon as it is
      saved. One that could not be saved (a network error, say) stays on the server, and the page offers
      <em>Save them to a folder…</em>, <em>Download them instead</em> or <em>Delete them from the server</em>,
      then and whenever the page is opened, until the next backup is started, which deletes it. A big zip can
      be too large for Chrome to write into a folder, as Chrome limits how much each website may store whatever
      your free disk space; the page then downloads it the ordinary way instead and says so. After an ordinary
      download, delete the server's copies once you have them.</p>
      <p><strong>Restore</strong>: choose one or more zips of one backup (hold Shift or Cmd to choose several).
      Only what they hold is restored: the Bible database, Drupal's database, the files, or any of them together.
      Zips of different backups are refused. A database restored replaces what is here: anything added since is
      lost, and after Drupal's database you log in with an account and password from the backup. A zip made
      before backups were split in three holds everything and is restored whole. Type <strong>RESTORE</strong> to
      confirm. Back up first if you may want the site as it is now.</p>
