# The editor (CKEditor 5) for a leader's email to one group member. Optional: installed only where CKEditor 5
# is enabled; without it the box is plain text. Only what the email keeps (contact.ALLOWED_TAGS): headings,
# bold, italic, underline, strikethrough, links, lists and quotations. No colours, fonts, pictures, tables or
# source editing: the cleaning would drop them.
langcode: en
status: true
dependencies:
  config:
    - filter.format.group_email
  module:
    - ckeditor5
  enforced:
    module:
      - bible_admin
format: group_email
editor: ckeditor5
settings:
  toolbar:
    items:
      - heading
      - '|'
      - bold
      - italic
      - underline
      - strikethrough
      - '|'
      - link
      - '|'
      - bulletedList
      - numberedList
      - blockQuote
      - '|'
      - undo
      - redo
  plugins:
    ckeditor5_heading:
      enabled_headings:
        - heading2
        - heading3
    ckeditor5_list:
      properties:
        reversed: false
        startIndex: false
        styles: false
      multiBlock: true
image_upload:
  status: false
