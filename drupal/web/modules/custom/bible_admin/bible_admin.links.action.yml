# Beside Schedule tasks (2026-11-23, the owner's request): the report to print.
bible_admin.scheduled_task_report_action:
  route_name: bible_admin.scheduled_task_report
  title: 'Scheduled Task Report'
  weight: 1
  appears_on:
    - bible_admin.scheduled_tasks

bible_admin.external_site_add_action:
  route_name: bible_admin.external_site_add
  title: 'Add a site'
  appears_on:
    - bible_admin.external_sites
