  title: 'Upload a Bible'
  appears_on:
    - bible_admin.list

bible_admin.site_settings_action:
  route_name: bible_admin.site_settings
  title: 'Site settings'
  appears_on:
    - bible_admin.list

bible_admin.site_user_add_action:
  route_name: bible_admin.site_user_add
  title: 'Add a site user'
  appears_on:
    - bible_admin.site_users

bible_admin.faq_note_add_action:
  route_name: bible_admin.faq_note_add
  title: 'Add a note'
  appears_on:
    - bible_admin.faq_notes

bible_admin.map_upload_action:
  route_name: bible_admin.map_upload
  title: 'Upload a map'
  appears_on:
    - bible_admin.maps

bible_admin.music_upload_action:
  route_name: bible_admin.music_upload
  title: 'Upload a song'
  appears_on:
    - bible_admin.music

bible_admin.music_spotify_add_action:
  route_name: bible_admin.music_spotify_add
  title: 'Add a Spotify item'
  appears_on:
    - bible_admin.music

bible_admin.signature_add_action:
  route_name: bible_admin.signature_add
  title: 'Add a signature'
  appears_on:
    - bible_admin.signatures

bible_admin.task_add_action:
  route_name: bible_admin.task_add
