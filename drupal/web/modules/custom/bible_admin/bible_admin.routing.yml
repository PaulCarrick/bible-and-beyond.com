bible_admin.list:
  path: '/admin/bibles'
  defaults:
    _controller: '\Drupal\bible_admin\Controller\BibleListController::build'
    _title: 'Bibles'
  requirements:
    _permission: 'administer bibles'

bible_admin.upload:
  path: '/admin/bibles/upload'
  defaults:
    _form: '\Drupal\bible_admin\Form\UploadForm'
    _title: 'Upload a Bible'
  requirements:
    _permission: 'administer bibles'

bible_admin.preview:
  path: '/admin/bibles/preview/{token}'
  defaults:
    _form: '\Drupal\bible_admin\Form\PreviewForm'
    _title: 'Check the upload'
  requirements:
    _permission: 'administer bibles'
    token: '[0-9a-f]{32}'

bible_admin.change:
  path: '/admin/bibles/{action}/{code}'
  defaults:
    _form: '\Drupal\bible_admin\Form\ChangeBibleForm'
    _title: 'Change a Bible'
  requirements:
    _permission: 'administer bibles'
    action: 'publish|unpublish|delete'
    code: '[A-Z0-9]{2,10}'

# The one screen for the options of the site. It is open to anyone who may administer Bibles or the
# site (the "+" means either); the form shows each person only the parts they may change.
bible_admin.site_settings:
  path: '/admin/site-settings'
  defaults:
    _form: '\Drupal\bible_admin\Form\SiteSettingsForm'
    _title: 'Site settings'
  requirements:
    _permission: 'administer bibles+administer site configuration'

# The address the search settings page used to have.
bible_admin.settings:
  path: '/admin/bibles/settings'
  defaults:
    _controller: '\Drupal\bible_admin\Controller\SiteSettingsRedirectController::redirectToSiteSettings'
    _title: 'Site settings'
  requirements:
    _permission: 'administer bibles+administer site configuration'

# The accounts of the main site's visitors (in the Bible database, not Drupal's users). Only for
# administrators: the Bible administrator role does not have this permission.
bible_admin.site_users:
  path: '/admin/site-users'
  defaults:
    _controller: '\Drupal\bible_admin\Controller\SiteUserListController::build'
    _title: 'Site users'
  requirements:
    _permission: 'administer site users'

bible_admin.site_user_add:
  path: '/admin/site-users/add'
  defaults:
    _form: '\Drupal\bible_admin\Form\SiteUserForm'
    _title: 'Add a site user'
  requirements:
    _permission: 'administer site users'

bible_admin.site_user_edit:
  path: '/admin/site-users/{user_id}/edit'
  defaults:
    _form: '\Drupal\bible_admin\Form\SiteUserForm'
    _title: 'Edit a site user'
  requirements:
    _permission: 'administer site users'
    user_id: '\d+'

bible_admin.site_user_delete:
  path: '/admin/site-users/{user_id}/delete'
  defaults:
    _form: '\Drupal\bible_admin\Form\DeleteSiteUserForm'
    _title: 'Delete a site user'
  requirements:
    _permission: 'administer site users'
    user_id: '\d+'
