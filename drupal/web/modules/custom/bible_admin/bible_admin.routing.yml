bible_admin.list:
  path: '/admin/bibles'
  defaults:
    _controller: '\Drupal\bible_admin\Controller\BibleListController::build'
    _title: 'Bibles'
  requirements:
    _permission: 'administer bibles'

bible_admin.upload:
  path: '/admin/bibles/upload'
  defaults:
    _form: '\Drupal\bible_admin\Form\UploadForm'
    _title: 'Upload a Bible'
  requirements:
    _permission: 'administer bibles'

bible_admin.preview:
  path: '/admin/bibles/preview/{token}'
  defaults:
    _form: '\Drupal\bible_admin\Form\PreviewForm'
    _title: 'Check the upload'
  requirements:
    _permission: 'administer bibles'
    token: '[0-9a-f]{32}'

bible_admin.change:
  path: '/admin/bibles/{action}/{code}'
  defaults:
    _form: '\Drupal\bible_admin\Form\ChangeBibleForm'
    _title: 'Change a Bible'
  requirements:
    _permission: 'administer bibles'
    action: 'publish|unpublish|delete'
    code: '[A-Z0-9]{2,10}'

# The one screen for the options of the site. It is open to anyone who may administer Bibles, the site
# settings or the site (the "+" means any of them); the form shows each person only the parts they may change.
bible_admin.site_settings:
  path: '/admin/site-settings'
  defaults:
    _form: '\Drupal\bible_admin\Form\SiteSettingsForm'
    _title: 'Site settings'
  requirements:
    _permission: 'administer bibles+administer site settings+administer site configuration'

# The address the search settings page used to have.
bible_admin.settings:
  path: '/admin/bibles/settings'
  defaults:
    _controller: '\Drupal\bible_admin\Controller\SiteSettingsRedirectController::redirectToSiteSettings'
    _title: 'Site settings'
  requirements:
    _permission: 'administer bibles+administer site settings+administer site configuration'

# The accounts of the main site's visitors (in the Bible database, not Drupal's users). Only for
# administrators: the Bible administrator role does not have this permission.
bible_admin.site_users:
  path: '/admin/site-users'
  defaults:
    _controller: '\Drupal\bible_admin\Controller\SiteUserListController::build'
    _title: 'Site users'
  requirements:
    _permission: 'administer site users'

bible_admin.site_user_add:
  path: '/admin/site-users/add'
  defaults:
    _form: '\Drupal\bible_admin\Form\SiteUserForm'
    _title: 'Add a site user'
  requirements:
    _permission: 'administer site users'

bible_admin.site_user_edit:
  path: '/admin/site-users/{user_id}/edit'
  defaults:
    _form: '\Drupal\bible_admin\Form\SiteUserForm'
    _title: 'Edit a site user'
  requirements:
    _permission: 'administer site users'
    user_id: '\d+'

bible_admin.site_user_delete:
  path: '/admin/site-users/{user_id}/delete'
  defaults:
    _form: '\Drupal\bible_admin\Form\DeleteSiteUserForm'
    _title: 'Delete a site user'
  requirements:
    _permission: 'administer site users'
    user_id: '\d+'

# The members' posts of Conversations (on the public site): read and remove them. Whoever may manage the site
# users may moderate their posts.
bible_admin.conversations:
  path: '/admin/conversations'
  defaults:
    _controller: '\Drupal\bible_admin\Controller\ConversationListController::build'
    _title: 'Conversations'
  requirements:
    _permission: 'administer site users'

bible_admin.conversation_delete:
  path: '/admin/conversations/{post_id}/delete'
  defaults:
    _form: '\Drupal\bible_admin\Form\DeleteConversationPostForm'
    _title: 'Delete a Conversations post'
  requirements:
    _permission: 'administer site users'
    post_id: '\d+'

# The commentaries, the devotionals and the Other books: one set of pages for each ({collection}), open to
# whoever may administer the Bibles.
bible_admin.library:
  path: '/admin/{collection}'
  defaults:
    _controller: '\Drupal\bible_admin\Controller\LibraryListController::build'
    _title_callback: '\Drupal\bible_admin\Controller\LibraryListController::title'
  requirements:
    _permission: 'administer bibles'
    collection: 'commentaries|devotionals|books'

bible_admin.library_upload:
  path: '/admin/{collection}/upload'
  defaults:
    _form: '\Drupal\bible_admin\Form\LibraryUploadForm'
    _title: 'Upload a file'
  requirements:
    _permission: 'administer bibles'
    collection: 'commentaries|devotionals|books'

bible_admin.library_preview:
  path: '/admin/{collection}/preview/{token}'
  defaults:
    _form: '\Drupal\bible_admin\Form\LibraryPreviewForm'
    _title: 'Check the upload'
  requirements:
    _permission: 'administer bibles'
    collection: 'commentaries|devotionals|books'
    token: '[0-9a-f]{32}'

bible_admin.library_change:
  path: '/admin/{collection}/{action}/{item_id}'
  defaults:
    _form: '\Drupal\bible_admin\Form\ChangeLibraryForm'
    _title: 'Change'
  requirements:
    _permission: 'administer bibles'
    collection: 'commentaries|devotionals|books'
    action: 'publish|unpublish|delete|refresh'
    item_id: '[a-z0-9][a-z0-9-]{1,48}[a-z0-9]'

# The site owner's notes under the FAQ answers ("A note from the site owner"), kept in the Bible database.
bible_admin.faq_notes:
  path: '/admin/faq-notes'
  defaults:
    _controller: '\Drupal\bible_admin\Controller\FaqNoteListController::build'
    _title: 'FAQ notes'
  requirements:
    _permission: 'administer faq notes'

bible_admin.faq_note_add:
  path: '/admin/faq-notes/add'
  defaults:
    _form: '\Drupal\bible_admin\Form\FaqNoteForm'
    _title: 'Add a FAQ note'
  requirements:
    _permission: 'administer faq notes'

bible_admin.faq_note_edit:
  path: '/admin/faq-notes/{note_id}/edit'
  defaults:
    _form: '\Drupal\bible_admin\Form\FaqNoteForm'
    _title: 'Edit a FAQ note'
  requirements:
    _permission: 'administer faq notes'
    note_id: '\d+'

bible_admin.faq_note_delete:
  path: '/admin/faq-notes/{note_id}/delete'
  defaults:
    _form: '\Drupal\bible_admin\Form\DeleteFaqNoteForm'
    _title: 'Delete a FAQ note'
  requirements:
    _permission: 'administer faq notes'
    note_id: '\d+'

# The Christian music section: songs with an MP3 or MP4 file, open to whoever may administer the Bibles.
bible_admin.music:
  path: '/admin/music'
  defaults:
    _controller: '\Drupal\bible_admin\Controller\MusicListController::build'
    _title: 'Christian music'
  requirements:
    _permission: 'administer bibles'

bible_admin.music_upload:
  path: '/admin/music/upload'
  defaults:
    _form: '\Drupal\bible_admin\Form\MusicForm'
    _title: 'Upload a song'
  requirements:
    _permission: 'administer bibles'

bible_admin.music_edit:
  path: '/admin/music/{song_id}/edit'
  defaults:
    _form: '\Drupal\bible_admin\Form\MusicForm'
    _title: 'Edit a song'
  requirements:
    _permission: 'administer bibles'
    song_id: '[a-z0-9][a-z0-9-]{1,48}[a-z0-9]'

bible_admin.music_change:
  path: '/admin/music/{action}/{song_id}'
  defaults:
    _form: '\Drupal\bible_admin\Form\ChangeMusicForm'
    _title: 'Change a song'
  requirements:
    _permission: 'administer bibles'
    action: 'publish|unpublish|delete'
    song_id: '[a-z0-9][a-z0-9-]{1,48}[a-z0-9]'

# Backing up the whole site into a zip saved on the administrator's computer, and restoring it from one
# (site_backup.py). Restoring replaces Drupal's own database too, so it is for administrators only. The page
# is driven by js/backup.js through the JSON routes below; the ones that change anything are POST only and
# need the X-CSRF-Token header.
bible_admin.backup:
  path: '/admin/backup-restore'
  defaults:
    _controller: '\Drupal\bible_admin\Controller\BackupController::page'
    _title: 'Backup and restore'
  requirements:
    _permission: 'administer backups'

bible_admin.backup_status:
  path: '/admin/backup-restore/status'
  defaults:
    _controller: '\Drupal\bible_admin\Controller\BackupController::status'
  methods: [GET]
  requirements:
    _permission: 'administer backups'

bible_admin.backup_download:
  path: '/admin/backup-restore/download/{name}'
  defaults:
    _controller: '\Drupal\bible_admin\Controller\BackupController::download'
  methods: [GET]
  requirements:
    _permission: 'administer backups'
    name: 'bible-and-beyond-\d{4}-\d{2}-\d{2}-\d{6}\.zip'

bible_admin.backup_action:
  path: '/admin/backup-restore/{action}'
  defaults:
    _controller: '\Drupal\bible_admin\Controller\BackupController::act'
  methods: [POST]
  requirements:
    _permission: 'administer backups'
    _csrf_request_header_token: 'TRUE'
    action: 'start|discard|upload|restore|dismiss'
