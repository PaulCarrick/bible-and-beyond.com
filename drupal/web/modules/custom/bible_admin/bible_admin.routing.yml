bible_admin.list:
  path: '/admin/bibles'
  defaults:
    _controller: '\Drupal\bible_admin\Controller\BibleListController::build'
    _title: 'Bibles'
  requirements:
    _permission: 'administer bibles'

bible_admin.upload:
  path: '/admin/bibles/upload'
  defaults:
    _form: '\Drupal\bible_admin\Form\UploadForm'
    _title: 'Upload a Bible'
  requirements:
    _permission: 'administer bibles'

bible_admin.preview:
  path: '/admin/bibles/preview/{token}'
  defaults:
    _form: '\Drupal\bible_admin\Form\PreviewForm'
    _title: 'Check the upload'
  requirements:
    _permission: 'administer bibles'
    token: '[0-9a-f]{32}'

bible_admin.change:
  path: '/admin/bibles/{action}/{code}'
  defaults:
    _form: '\Drupal\bible_admin\Form\ChangeBibleForm'
    _title: 'Change a Bible'
  requirements:
    _permission: 'administer bibles'
    action: 'publish|unpublish|delete'
    code: '[A-Z0-9]{2,10}'

# The one screen for the options of the site. It is open to anyone who may administer Bibles, the site
# settings or the site (the "+" means any of them); the form shows each person only the parts they may change.
bible_admin.site_settings:
  path: '/admin/site-settings'
  defaults:
    _form: '\Drupal\bible_admin\Form\SiteSettingsForm'
    _title: 'Site settings'
  requirements:
    _permission: 'administer bibles+administer site settings+administer site configuration'

# The address the search settings page used to have.
bible_admin.settings:
  path: '/admin/bibles/settings'
  defaults:
    _controller: '\Drupal\bible_admin\Controller\SiteSettingsRedirectController::redirectToSiteSettings'
    _title: 'Site settings'
  requirements:
    _permission: 'administer bibles+administer site settings+administer site configuration'

# The accounts of the main site's visitors (in the Bible database, not Drupal's users). Only for
# administrators: the Bible administrator role does not have this permission.
bible_admin.site_users:
  path: '/admin/site-users'
  defaults:
    _controller: '\Drupal\bible_admin\Controller\SiteUserListController::build'
    _title: 'Site users'
  requirements:
    _permission: 'administer site users'

bible_admin.site_user_add:
  path: '/admin/site-users/add'
  defaults:
    _form: '\Drupal\bible_admin\Form\SiteUserForm'
    _title: 'Add a site user'
  requirements:
    _permission: 'administer site users'

bible_admin.site_user_edit:
  path: '/admin/site-users/{user_id}/edit'
  defaults:
    _form: '\Drupal\bible_admin\Form\SiteUserForm'
    _title: 'Edit a site user'
  requirements:
    _permission: 'administer site users'
    user_id: '\d+'

bible_admin.site_user_delete:
  path: '/admin/site-users/{user_id}/delete'
  defaults:
    _form: '\Drupal\bible_admin\Form\DeleteSiteUserForm'
    _title: 'Delete a site user'
  requirements:
    _permission: 'administer site users'
    user_id: '\d+'

# The members' posts of Conversations (on the public site): read and remove them. Whoever may manage the site
# users may moderate their posts.
bible_admin.conversations:
  path: '/admin/conversations'
  defaults:
    _controller: '\Drupal\bible_admin\Controller\ConversationListController::build'
    _title: 'Conversations and Prayer Wall'
  requirements:
    _permission: 'administer site users'

bible_admin.conversation_delete:
  path: '/admin/conversations/{post_id}/delete'
  defaults:
    _form: '\Drupal\bible_admin\Form\DeleteConversationPostForm'
    _title: 'A Conversations post'
  requirements:
    _permission: 'administer site users'
    post_id: '\d+'

bible_admin.conversation_reply_delete:
  path: '/admin/conversations/replies/{reply_id}/delete'
  defaults:
    _form: '\Drupal\bible_admin\Form\DeleteConversationReplyForm'
    _title: 'Delete a Conversations reply'
  requirements:
    _permission: 'administer site users'
    reply_id: '\d+'

# The commentaries, the devotionals and the Other books: one set of pages for each ({collection}), open to
# whoever may administer the Bibles.
bible_admin.library:
  path: '/admin/{collection}'
  defaults:
    _controller: '\Drupal\bible_admin\Controller\LibraryListController::build'
    _title_callback: '\Drupal\bible_admin\Controller\LibraryListController::title'
  requirements:
    _permission: 'administer bibles'
    collection: 'commentaries|devotionals|books'

bible_admin.library_upload:
  path: '/admin/{collection}/upload'
  defaults:
    _form: '\Drupal\bible_admin\Form\LibraryUploadForm'
    _title: 'Upload a file'
  requirements:
    _permission: 'administer bibles'
    collection: 'commentaries|devotionals|books'

bible_admin.library_preview:
  path: '/admin/{collection}/preview/{token}'
  defaults:
    _form: '\Drupal\bible_admin\Form\LibraryPreviewForm'
    _title: 'Check the upload'
  requirements:
    _permission: 'administer bibles'
    collection: 'commentaries|devotionals|books'
    token: '[0-9a-f]{32}'

bible_admin.library_edit:
  path: '/admin/{collection}/edit/{item_id}'
  defaults:
    _form: '\Drupal\bible_admin\Form\LibraryEditForm'
    _title: 'Edit the details'
  requirements:
    _permission: 'administer bibles'
    collection: 'commentaries|devotionals|books'
    item_id: '[a-z0-9][a-z0-9-]{1,48}[a-z0-9]'

bible_admin.library_change:
  path: '/admin/{collection}/{action}/{item_id}'
  defaults:
    _form: '\Drupal\bible_admin\Form\ChangeLibraryForm'
    _title: 'Change'
  requirements:
    _permission: 'administer bibles'
    collection: 'commentaries|devotionals|books'
    action: 'publish|unpublish|delete|refresh'
    item_id: '[a-z0-9][a-z0-9-]{1,48}[a-z0-9]'

# The site owner's notes under the FAQ answers ("A note from the site owner"), kept in the Bible database.
bible_admin.faq_notes:
  path: '/admin/faq-notes'
  defaults:
    _controller: '\Drupal\bible_admin\Controller\FaqNoteListController::build'
    _title: 'FAQ notes'
  requirements:
    _permission: 'administer faq notes'

bible_admin.faq_note_add:
  path: '/admin/faq-notes/add'
  defaults:
    _form: '\Drupal\bible_admin\Form\FaqNoteForm'
    _title: 'Add a FAQ note'
  requirements:
    _permission: 'administer faq notes'

bible_admin.faq_note_edit:
  path: '/admin/faq-notes/{note_id}/edit'
  defaults:
    _form: '\Drupal\bible_admin\Form\FaqNoteForm'
    _title: 'Edit a FAQ note'
  requirements:
    _permission: 'administer faq notes'
    note_id: '\d+'

bible_admin.faq_note_delete:
  path: '/admin/faq-notes/{note_id}/delete'
  defaults:
    _form: '\Drupal\bible_admin\Form\DeleteFaqNoteForm'
    _title: 'Delete a FAQ note'
  requirements:
    _permission: 'administer faq notes'
    note_id: '\d+'

# The Christian music section: songs with an MP3 or MP4 file, open to whoever may administer the Bibles.
# Several files at once (the drop area on the Christian music, Devotionals and Other books pages,
# js/bulk-upload.js): the page sends one file a time to this route, which saves it as a new item named after
# the file. POST only, with the CSRF header.
bible_admin.bulk_upload:
  path: '/admin/{collection}/bulk-upload'
  defaults:
    _controller: '\Drupal\bible_admin\Controller\BulkUploadController::upload'
  methods: [POST]
  requirements:
    _permission: 'administer bibles'
    _csrf_request_header_token: 'TRUE'
    collection: 'music|devotionals|books|maps|verse-images'

bible_admin.music:
  path: '/admin/music'
  defaults:
    _controller: '\Drupal\bible_admin\Controller\MusicListController::build'
    _title: 'Christian music'
  requirements:
    _permission: 'administer bibles'

bible_admin.music_upload:
  path: '/admin/music/upload'
  defaults:
    _form: '\Drupal\bible_admin\Form\MusicForm'
    _title: 'Upload a song'
  requirements:
    _permission: 'administer bibles'

bible_admin.music_edit:
  path: '/admin/music/{song_id}/edit'
  defaults:
    _form: '\Drupal\bible_admin\Form\MusicForm'
    _title: 'Edit a song'
  requirements:
    _permission: 'administer bibles'
    song_id: '[a-z0-9][a-z0-9-]{1,48}[a-z0-9]'

bible_admin.music_change:
  path: '/admin/music/{action}/{song_id}'
  defaults:
    _form: '\Drupal\bible_admin\Form\ChangeMusicForm'
    _title: 'Change a song'
  requirements:
    _permission: 'administer bibles'
    action: 'publish|unpublish|delete'
    song_id: '[a-z0-9][a-z0-9-]{1,48}[a-z0-9]'

# The maps: pictures or PDFs with their details and verses (maps.py), open to whoever may administer the Bibles.
bible_admin.maps:
  path: '/admin/maps'
  defaults:
    _controller: '\Drupal\bible_admin\Controller\MapListController::build'
    _title: 'Maps'
  requirements:
    _permission: 'administer bibles'

bible_admin.map_upload:
  path: '/admin/maps/upload'
  defaults:
    _form: '\Drupal\bible_admin\Form\MapForm'
    _title: 'Upload a map'
  requirements:
    _permission: 'administer bibles'

bible_admin.map_edit:
  path: '/admin/maps/{map_id}/edit'
  defaults:
    _form: '\Drupal\bible_admin\Form\MapForm'
    _title: 'Edit a map'
  requirements:
    _permission: 'administer bibles'
    map_id: '[a-z0-9][a-z0-9-]{1,48}[a-z0-9]'

bible_admin.map_change:
  path: '/admin/maps/{action}/{map_id}'
  defaults:
    _form: '\Drupal\bible_admin\Form\ChangeMapForm'
    _title: 'Change a map'
  requirements:
    _permission: 'administer bibles'
    action: 'publish|unpublish|delete'
    map_id: '[a-z0-9][a-z0-9-]{1,48}[a-z0-9]'

# The verse a day pictures (verse_images.py): uploaded here, never shown on the site; a later picture message of
# the verse a day will use one chosen at random. Open to whoever may administer the Bibles.
bible_admin.verse_images:
  path: '/admin/verse-images'
  defaults:
    _controller: '\Drupal\bible_admin\Controller\VerseImageListController::build'
    _title: 'Verse a day pictures'
  requirements:
    _permission: 'administer bibles'

bible_admin.verse_image_change:
  path: '/admin/verse-images/{action}/{image_id}'
  defaults:
    _form: '\Drupal\bible_admin\Form\ChangeVerseImageForm'
    _title: 'Change a picture'
  requirements:
    _permission: 'administer bibles'
    action: 'use|unuse|delete'
    image_id: '[a-z0-9][a-z0-9-]{1,48}[a-z0-9]'

# Groups (groups.py): a leader's groups of people and the messages sent to them. "lead groups" (a Group leader:
# only their own groups) or "administer groups" (all of them); each group page also checks that the group is the
# user's own (GroupAccess) unless they administer all groups.
bible_admin.groups:
  path: '/admin/groups'
  defaults:
    _controller: '\Drupal\bible_admin\Controller\GroupController::list'
    _title: 'Groups'
  requirements:
    _permission: 'lead groups+administer groups'

bible_admin.group_add:
  path: '/admin/groups/add'
  defaults:
    _form: '\Drupal\bible_admin\Form\GroupForm'
    _title: 'Make a group'
  requirements:
    _permission: 'lead groups+administer groups'

bible_admin.group:
  path: '/admin/groups/{group_id}'
  defaults:
    _controller: '\Drupal\bible_admin\Controller\GroupController::view'
    _title_callback: '\Drupal\bible_admin\Controller\GroupController::title'
  requirements:
    _custom_access: '\Drupal\bible_admin\GroupAccess::access'
    group_id: '\d+'

bible_admin.group_edit:
  path: '/admin/groups/{group_id}/edit'
  defaults:
    _form: '\Drupal\bible_admin\Form\GroupForm'
    _title: 'Change a group'
  requirements:
    _custom_access: '\Drupal\bible_admin\GroupAccess::access'
    group_id: '\d+'

bible_admin.group_delete:
  path: '/admin/groups/{group_id}/delete'
  defaults:
    _form: '\Drupal\bible_admin\Form\DeleteGroupForm'
    _title: 'Delete a group'
  requirements:
    _custom_access: '\Drupal\bible_admin\GroupAccess::access'
    group_id: '\d+'

bible_admin.group_member_add:
  path: '/admin/groups/{group_id}/members/add'
  defaults:
    _form: '\Drupal\bible_admin\Form\GroupMemberForm'
    _title: 'Add a member'
  requirements:
    _custom_access: '\Drupal\bible_admin\GroupAccess::access'
    group_id: '\d+'

bible_admin.group_member_edit:
  path: '/admin/groups/{group_id}/members/{member_id}/edit'
  defaults:
    _form: '\Drupal\bible_admin\Form\GroupMemberForm'
    _title: 'Change a member'
  requirements:
    _custom_access: '\Drupal\bible_admin\GroupAccess::access'
    group_id: '\d+'
    member_id: '\d+'

bible_admin.group_member_remove:
  path: '/admin/groups/{group_id}/members/{member_id}/remove'
  defaults:
    _form: '\Drupal\bible_admin\Form\RemoveGroupMemberForm'
    _title: 'Remove a member'
  requirements:
    _custom_access: '\Drupal\bible_admin\GroupAccess::access'
    group_id: '\d+'
    member_id: '\d+'

bible_admin.group_schedule_add:
  path: '/admin/groups/{group_id}/schedules/add'
  defaults:
    _form: '\Drupal\bible_admin\Form\GroupScheduleForm'
    _title: 'Add a scheduled email'
  requirements:
    _custom_access: '\Drupal\bible_admin\GroupAccess::access'
    group_id: '\d+'

bible_admin.group_schedule_edit:
  path: '/admin/groups/{group_id}/schedules/{schedule_id}/edit'
  defaults:
    _form: '\Drupal\bible_admin\Form\GroupScheduleForm'
    _title: 'Change a scheduled email'
  requirements:
    _custom_access: '\Drupal\bible_admin\GroupAccess::access'
    group_id: '\d+'
    schedule_id: '\d+'

bible_admin.group_schedule_remove:
  path: '/admin/groups/{group_id}/schedules/{schedule_id}/remove'
  defaults:
    _form: '\Drupal\bible_admin\Form\RemoveGroupScheduleForm'
    _title: 'Remove a scheduled email'
  requirements:
    _custom_access: '\Drupal\bible_admin\GroupAccess::access'
    group_id: '\d+'
    schedule_id: '\d+'

bible_admin.group_send:
  path: '/admin/groups/{group_id}/send/{kind}'
  defaults:
    _form: '\Drupal\bible_admin\Form\GroupSendForm'
    _title: 'Send to the group'
  requirements:
    _custom_access: '\Drupal\bible_admin\GroupAccess::access'
    group_id: '\d+'
    kind: 'message|verse|picture'

# Backing up the whole site into a zip saved on the administrator's computer, and restoring it from one
# (site_backup.py). Restoring replaces Drupal's own database too, so it is for administrators only. The page
# is driven by js/backup.js through the JSON routes below; the ones that change anything are POST only and
# need the X-CSRF-Token header.
bible_admin.backup:
  path: '/admin/backup-restore'
  defaults:
    _controller: '\Drupal\bible_admin\Controller\BackupController::page'
    _title: 'Backup and restore'
  requirements:
    _permission: 'administer backups'

bible_admin.backup_status:
  path: '/admin/backup-restore/status'
  defaults:
    _controller: '\Drupal\bible_admin\Controller\BackupController::status'
  methods: [GET]
  requirements:
    _permission: 'administer backups'

bible_admin.backup_download:
  path: '/admin/backup-restore/download/{name}'
  defaults:
    _controller: '\Drupal\bible_admin\Controller\BackupController::download'
  methods: [GET]
  requirements:
    _permission: 'administer backups'
    name: 'bible-and-beyond-\d{4}-\d{2}-\d{2}-\d{6}\.zip'

bible_admin.backup_action:
  path: '/admin/backup-restore/{action}'
  defaults:
    _controller: '\Drupal\bible_admin\Controller\BackupController::act'
  methods: [POST]
  requirements:
    _permission: 'administer backups'
    _csrf_request_header_token: 'TRUE'
    action: 'start|discard|upload|restore|dismiss'
