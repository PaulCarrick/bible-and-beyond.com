bible_admin.list:
  path: '/admin/bibles'
  defaults:
    _controller: '\Drupal\bible_admin\Controller\BibleListController::build'
    _title: 'Bibles'
  requirements:
    _permission: 'administer bibles'

bible_admin.upload:
  path: '/admin/bibles/upload'
  defaults:
    _form: '\Drupal\bible_admin\Form\UploadForm'
    _title: 'Upload a Bible'
  requirements:
    _permission: 'administer bibles'

bible_admin.preview:
  path: '/admin/bibles/preview/{token}'
  defaults:
    _form: '\Drupal\bible_admin\Form\PreviewForm'
    _title: 'Check the upload'
  requirements:
    _permission: 'administer bibles'
    token: '[0-9a-f]{32}'

bible_admin.change:
  path: '/admin/bibles/{action}/{code}'
  defaults:
    _form: '\Drupal\bible_admin\Form\ChangeBibleForm'
    _title: 'Change a Bible'
  requirements:
    _permission: 'administer bibles'
    action: 'publish|unpublish|delete'
    code: '[A-Z0-9]{2,10}'

# The one screen for the options of the site. It is open to anyone who may administer Bibles or the
# site (the "+" means either); the form shows each person only the parts they may change.
bible_admin.site_settings:
  path: '/admin/site-settings'
  defaults:
    _form: '\Drupal\bible_admin\Form\SiteSettingsForm'
    _title: 'Site settings'
  requirements:
    _permission: 'administer bibles+administer site configuration'

# The address the search settings page used to have.
bible_admin.settings:
  path: '/admin/bibles/settings'
  defaults:
    _controller: '\Drupal\bible_admin\Controller\SiteSettingsRedirectController::redirectToSiteSettings'
    _title: 'Site settings'
  requirements:
    _permission: 'administer bibles+administer site configuration'
