bible_admin.list:
  path: '/admin/bibles'
  defaults:
    _controller: '\Drupal\bible_admin\Controller\BibleListController::build'
    _title: 'Bibles'
  requirements:
    _permission: 'administer bibles'

bible_admin.upload:
  path: '/admin/bibles/upload'
  defaults:
    _form: '\Drupal\bible_admin\Form\UploadForm'
    _title: 'Upload a Bible'
  requirements:
    _permission: 'administer bibles'

bible_admin.preview:
  path: '/admin/bibles/preview/{token}'
  defaults:
    _form: '\Drupal\bible_admin\Form\PreviewForm'
    _title: 'Check the upload'
  requirements:
    _permission: 'administer bibles'
    token: '[0-9a-f]{32}'

bible_admin.change:
  path: '/admin/bibles/{action}/{code}'
  defaults:
    _form: '\Drupal\bible_admin\Form\ChangeBibleForm'
    _title: 'Change a Bible'
  requirements:
    _permission: 'administer bibles'
    action: 'publish|unpublish|delete'
    code: '[A-Z0-9]{2,10}'

# The one screen for the options of the site. It is open to anyone who may administer Bibles, the site
# settings or the site (the "+" means any of them); the form shows each person only the parts they may change.
bible_admin.site_settings:
  path: '/admin/site-settings'
  defaults:
    _form: '\Drupal\bible_admin\Form\SiteSettingsForm'
    _title: 'Site settings'
  requirements:
    _permission: 'administer bibles+administer site settings+administer site configuration'

# The address the search settings page used to have.
bible_admin.settings:
  path: '/admin/bibles/settings'
  defaults:
    _controller: '\Drupal\bible_admin\Controller\SiteSettingsRedirectController::redirectToSiteSettings'
    _title: 'Site settings'
  requirements:
    _permission: 'administer bibles+administer site settings+administer site configuration'

# The accounts of the main site's visitors (in the Bible database, not Drupal's users). Only for
# administrators: the Bible administrator role does not have this permission.
bible_admin.site_users:
  path: '/admin/site-users'
  defaults:
    _controller: '\Drupal\bible_admin\Controller\SiteUserListController::build'
    _title: 'Site users'
  requirements:
    _permission: 'administer site users'

bible_admin.site_user_add:
  path: '/admin/site-users/add'
  defaults:
    _form: '\Drupal\bible_admin\Form\SiteUserForm'
    _title: 'Add a site user'
  requirements:
    _permission: 'administer site users'

bible_admin.site_user_edit:
  path: '/admin/site-users/{user_id}/edit'
  defaults:
    _form: '\Drupal\bible_admin\Form\SiteUserForm'
    _title: 'Edit a site user'
  requirements:
    _permission: 'administer site users'
    user_id: '\d+'

bible_admin.site_user_delete:
  path: '/admin/site-users/{user_id}/delete'
  defaults:
    _form: '\Drupal\bible_admin\Form\DeleteSiteUserForm'
    _title: 'Delete a site user'
  requirements:
    _permission: 'administer site users'
    user_id: '\d+'

# The members' posts of Conversations (on the public site): read and remove them. Whoever may manage the site
# users may moderate their posts.
bible_admin.conversations:
  path: '/admin/conversations'
  defaults:
    _controller: '\Drupal\bible_admin\Controller\ConversationListController::build'
    _title: 'Conversations and Prayer Wall'
  requirements:
    _permission: 'administer site users'

bible_admin.conversation_delete:
  path: '/admin/conversations/{post_id}/delete'
  defaults:
    _form: '\Drupal\bible_admin\Form\DeleteConversationPostForm'
    _title: 'A Conversations post'
  requirements:
    _permission: 'administer site users'
    post_id: '\d+'

bible_admin.conversation_reply_delete:
  path: '/admin/conversations/replies/{reply_id}/delete'
  defaults:
    _form: '\Drupal\bible_admin\Form\DeleteConversationReplyForm'
    _title: 'Delete a Conversations reply'
  requirements:
    _permission: 'administer site users'
    reply_id: '\d+'

# The commentaries, the devotionals and the Other books: one set of pages for each ({collection}), open to
# whoever may administer the Bibles.
bible_admin.library:
  path: '/admin/{collection}'
  defaults:
    _controller: '\Drupal\bible_admin\Controller\LibraryListController::build'
    _title_callback: '\Drupal\bible_admin\Controller\LibraryListController::title'
  requirements:
    _permission: 'administer bibles'
    collection: 'commentaries|devotionals|books'

bible_admin.library_upload:
  path: '/admin/{collection}/upload'
  defaults:
    _form: '\Drupal\bible_admin\Form\LibraryUploadForm'
    _title: 'Upload a file'
  requirements:
    _permission: 'administer bibles'
    collection: 'commentaries|devotionals|books'

bible_admin.library_preview:
  path: '/admin/{collection}/preview/{token}'
  defaults:
    _form: '\Drupal\bible_admin\Form\LibraryPreviewForm'
    _title: 'Check the upload'
  requirements:
    _permission: 'administer bibles'
    collection: 'commentaries|devotionals|books'
    token: '[0-9a-f]{32}'

bible_admin.library_edit:
  path: '/admin/{collection}/edit/{item_id}'
  defaults:
    _form: '\Drupal\bible_admin\Form\LibraryEditForm'
    _title: 'Edit the details'
  requirements:
    _permission: 'administer bibles'
    collection: 'commentaries|devotionals|books'
    item_id: '[a-z0-9][a-z0-9-]{1,48}[a-z0-9]'

bible_admin.library_change:
  path: '/admin/{collection}/{action}/{item_id}'
  defaults:
    _form: '\Drupal\bible_admin\Form\ChangeLibraryForm'
    _title: 'Change'
  requirements:
    _permission: 'administer bibles'
    collection: 'commentaries|devotionals|books'
    action: 'publish|unpublish|delete|refresh'
    item_id: '[a-z0-9][a-z0-9-]{1,48}[a-z0-9]'

# The site owner's notes under the FAQ answers ("A note from the site owner"), kept in the Bible database.
bible_admin.faq_notes:
  path: '/admin/faq-notes'
  defaults:
    _controller: '\Drupal\bible_admin\Controller\FaqNoteListController::build'
    _title: 'FAQ notes'
  requirements:
    _permission: 'administer faq notes'

bible_admin.faq_note_add:
  path: '/admin/faq-notes/add'
  defaults:
    _form: '\Drupal\bible_admin\Form\FaqNoteForm'
    _title: 'Add a FAQ note'
  requirements:
    _permission: 'administer faq notes'

bible_admin.faq_note_edit:
  path: '/admin/faq-notes/{note_id}/edit'
  defaults:
    _form: '\Drupal\bible_admin\Form\FaqNoteForm'
    _title: 'Edit a FAQ note'
  requirements:
    _permission: 'administer faq notes'
    note_id: '\d+'

bible_admin.faq_note_delete:
  path: '/admin/faq-notes/{note_id}/delete'
  defaults:
    _form: '\Drupal\bible_admin\Form\DeleteFaqNoteForm'
    _title: 'Delete a FAQ note'
  requirements:
    _permission: 'administer faq notes'
    note_id: '\d+'

# The FAQ questions (2026-11-20): the site's own list, grouped under headings, and the words about the site sent
# to Gemini. Open to whoever may administer the FAQ notes.
bible_admin.faq_questions:
  path: '/admin/faq-questions'
  defaults:
    _controller: '\Drupal\bible_admin\Controller\FaqQuestionListController::build'
    _title: 'FAQ questions'
  requirements:
    _permission: 'administer faq notes'

bible_admin.faq_question_add:
  path: '/admin/faq-questions/add'
  defaults:
    _form: '\Drupal\bible_admin\Form\FaqQuestionForm'
    _title: 'Add a FAQ question'
  requirements:
    _permission: 'administer faq notes'

bible_admin.faq_question_edit:
  path: '/admin/faq-questions/{question_id}/edit'
  defaults:
    _form: '\Drupal\bible_admin\Form\FaqQuestionForm'
    _title: 'Edit a FAQ question'
  requirements:
    _permission: 'administer faq notes'
    question_id: '\d+'

bible_admin.faq_question_delete:
  path: '/admin/faq-questions/{question_id}/delete'
  defaults:
    _form: '\Drupal\bible_admin\Form\DeleteFaqQuestionForm'
    _title: 'Delete a FAQ question'
  requirements:
    _permission: 'administer faq notes'
    question_id: '\d+'

bible_admin.faq_question_move:
  path: '/admin/faq-questions/{question_id}/move/{direction}'
  defaults:
    _controller: '\Drupal\bible_admin\Controller\FaqQuestionListController::move'
  requirements:
    _permission: 'administer faq notes'
    _csrf_token: 'TRUE'
    question_id: '\d+'
    direction: 'up|down'

bible_admin.faq_about:
  path: '/admin/faq-questions/about'
  defaults:
    _form: '\Drupal\bible_admin\Form\FaqAboutForm'
    _title: 'About this site, for the FAQ answers'
  requirements:
    _permission: 'administer faq notes'

bible_admin.faq_built_in:
  path: '/admin/faq-questions/built-in'
  defaults:
    _form: '\Drupal\bible_admin\Form\FaqBuiltInForm'
    _title: 'Go back to the built-in FAQ questions'
  requirements:
    _permission: 'administer faq notes'

# The Christian music section: songs with an MP3 or MP4 file, open to whoever may administer the Bibles.
# Several files at once (the drop area on the Christian music, Devotionals and Other books pages,
# js/bulk-upload.js): the page sends one file a time to this route, which saves it as a new item named after
# the file. POST only, with the CSRF header.
bible_admin.bulk_upload:
  path: '/admin/{collection}/bulk-upload'
  defaults:
    _controller: '\Drupal\bible_admin\Controller\BulkUploadController::upload'
  methods: [POST]
  requirements:
    _permission: 'administer bibles'
    _csrf_request_header_token: 'TRUE'
    collection: 'music|devotionals|books|maps|verse-images'

bible_admin.music:
  path: '/admin/music'
  defaults:
    _controller: '\Drupal\bible_admin\Controller\MusicListController::build'
    _title: 'Christian music'
  requirements:
    _permission: 'administer bibles'

bible_admin.music_upload:
  path: '/admin/music/upload'
  defaults:
    _form: '\Drupal\bible_admin\Form\MusicForm'
    _title: 'Upload a song'
  requirements:
    _permission: 'administer bibles'

bible_admin.music_edit:
  path: '/admin/music/{song_id}/edit'
  defaults:
    _form: '\Drupal\bible_admin\Form\MusicForm'
    _title: 'Edit a song'
  requirements:
    _permission: 'administer bibles'
    song_id: '[a-z0-9][a-z0-9-]{1,48}[a-z0-9]'

# A Spotify item (music.add_spotify): a Spotify link in place of a file, shown with Spotify's embedded player.
bible_admin.music_spotify_add:
  path: '/admin/music/spotify/add'
  defaults:
    _form: '\Drupal\bible_admin\Form\MusicSpotifyForm'
    _title: 'Add a Spotify item'
  requirements:
    _permission: 'administer bibles'

bible_admin.music_spotify_edit:
  path: '/admin/music/spotify/{song_id}/edit'
  defaults:
    _form: '\Drupal\bible_admin\Form\MusicSpotifyForm'
    _title: 'Edit a Spotify item'
  requirements:
    _permission: 'administer bibles'
    song_id: '[a-z0-9][a-z0-9-]{1,48}[a-z0-9]'

bible_admin.music_change:
  path: '/admin/music/{action}/{song_id}'
  defaults:
    _form: '\Drupal\bible_admin\Form\ChangeMusicForm'
    _title: 'Change a song'
  requirements:
    _permission: 'administer bibles'
    action: 'publish|unpublish|delete|remove-words'
    song_id: '[a-z0-9][a-z0-9-]{1,48}[a-z0-9]'

# The maps: pictures or PDFs with their details and verses (maps.py), open to whoever may administer the Bibles.
bible_admin.maps:
  path: '/admin/maps'
  defaults:
    _controller: '\Drupal\bible_admin\Controller\MapListController::build'
    _title: 'Maps'
  requirements:
    _permission: 'administer bibles'

bible_admin.map_upload:
  path: '/admin/maps/upload'
  defaults:
    _form: '\Drupal\bible_admin\Form\MapForm'
    _title: 'Upload a map'
  requirements:
    _permission: 'administer bibles'

bible_admin.map_edit:
  path: '/admin/maps/{map_id}/edit'
  defaults:
    _form: '\Drupal\bible_admin\Form\MapForm'
    _title: 'Edit a map'
  requirements:
    _permission: 'administer bibles'
    map_id: '[a-z0-9][a-z0-9-]{1,48}[a-z0-9]'

bible_admin.map_change:
  path: '/admin/maps/{action}/{map_id}'
  defaults:
    _form: '\Drupal\bible_admin\Form\ChangeMapForm'
    _title: 'Change a map'
  requirements:
    _permission: 'administer bibles'
    action: 'publish|unpublish|delete'
    map_id: '[a-z0-9][a-z0-9-]{1,48}[a-z0-9]'

# The verse a day pictures (verse_images.py): uploaded here, never shown on the site; a later picture message of
# the verse a day will use one chosen at random. Open to whoever may administer the Bibles.
bible_admin.verse_images:
  path: '/admin/verse-images'
  defaults:
    _controller: '\Drupal\bible_admin\Controller\VerseImageListController::build'
    _title: 'Verse a day pictures'
  requirements:
    _permission: 'administer bibles'

# Changing a picture's name in place on the list (js/verse-images.js): POST only, with the CSRF header.
bible_admin.verse_image_rename:
  path: '/admin/verse-images/rename/{image_id}'
  defaults:
    _controller: '\Drupal\bible_admin\Controller\VerseImageListController::rename'
  methods: [POST]
  requirements:
    _permission: 'administer bibles'
    _csrf_request_header_token: 'TRUE'
    image_id: '[a-z0-9][a-z0-9-]{1,48}[a-z0-9]'

# A larger copy of a picture for the window opened from its thumbnail (made on request, never kept).
bible_admin.verse_image_preview:
  path: '/admin/verse-images/preview/{image_id}'
  defaults:
    _controller: '\Drupal\bible_admin\Controller\VerseImageListController::preview'
  methods: [GET]
  requirements:
    _permission: 'administer bibles'
    image_id: '[a-z0-9][a-z0-9-]{1,48}[a-z0-9]'

bible_admin.verse_image_change:
  path: '/admin/verse-images/{action}/{image_id}'
  defaults:
    _form: '\Drupal\bible_admin\Form\ChangeVerseImageForm'
    _title: 'Change a picture'
  requirements:
    _permission: 'administer bibles'
    action: 'use|unuse|delete'
    image_id: '[a-z0-9][a-z0-9-]{1,48}[a-z0-9]'

# Groups (groups.py): a leader's groups of people and the messages sent to them. "lead groups" (a Group leader:
# only their own groups) or "administer groups" (all of them); each group page also checks that the group is the
# user's own (GroupAccess) unless they administer all groups.
bible_admin.groups:
  path: '/admin/groups'
  defaults:
    _controller: '\Drupal\bible_admin\Controller\GroupController::list'
    _title: 'Groups'
  requirements:
    _permission: 'lead groups+administer groups'

bible_admin.group_add:
  path: '/admin/groups/add'
  defaults:
    _form: '\Drupal\bible_admin\Form\GroupForm'
    _title: 'Make a group'
  requirements:
    _permission: 'lead groups+administer groups'

bible_admin.group:
  path: '/admin/groups/{group_id}'
  defaults:
    _controller: '\Drupal\bible_admin\Controller\GroupController::view'
    _title_callback: '\Drupal\bible_admin\Controller\GroupController::title'
  requirements:
    _custom_access: '\Drupal\bible_admin\GroupAccess::access'
    group_id: '\d+'

bible_admin.group_edit:
  path: '/admin/groups/{group_id}/edit'
  defaults:
    _form: '\Drupal\bible_admin\Form\GroupForm'
    _title: 'Change a group'
  requirements:
    _custom_access: '\Drupal\bible_admin\GroupAccess::access'
    group_id: '\d+'

bible_admin.group_delete:
  path: '/admin/groups/{group_id}/delete'
  defaults:
    _form: '\Drupal\bible_admin\Form\DeleteGroupForm'
    _title: 'Delete a group'
  requirements:
    _custom_access: '\Drupal\bible_admin\GroupAccess::access'
    group_id: '\d+'

bible_admin.group_member_add:
  path: '/admin/groups/{group_id}/members/add'
  defaults:
    _form: '\Drupal\bible_admin\Form\GroupMemberForm'
    _title: 'Add a member'
  requirements:
    _custom_access: '\Drupal\bible_admin\GroupAccess::access'
    group_id: '\d+'

bible_admin.group_member_edit:
  path: '/admin/groups/{group_id}/members/{member_id}/edit'
  defaults:
    _form: '\Drupal\bible_admin\Form\GroupMemberForm'
    _title: 'Change a member'
  requirements:
    _custom_access: '\Drupal\bible_admin\GroupAccess::access'
    group_id: '\d+'
    member_id: '\d+'

bible_admin.group_member_remove:
  path: '/admin/groups/{group_id}/members/{member_id}/remove'
  defaults:
    _form: '\Drupal\bible_admin\Form\RemoveGroupMemberForm'
    _title: 'Remove a member'
  requirements:
    _custom_access: '\Drupal\bible_admin\GroupAccess::access'
    group_id: '\d+'
    member_id: '\d+'

# A member's stopped scheduled emails start again (an undo; it asks first).
bible_admin.group_member_restart_schedules:
  path: '/admin/groups/{group_id}/members/{member_id}/restart-schedules'
  defaults:
    _form: '\Drupal\bible_admin\Form\RestartMemberSchedulesForm'
    _title: 'Start scheduled emails again'
  requirements:
    _custom_access: '\Drupal\bible_admin\GroupAccess::access'
    group_id: '\d+'
    member_id: '\d+'

# An email to one member only (the address in the member list opens it in a dialog).
bible_admin.group_member_email:
  path: '/admin/groups/{group_id}/members/{member_id}/email'
  defaults:
    _form: '\Drupal\bible_admin\Form\GroupMemberEmailForm'
    _title: 'Email a member'
  requirements:
    _custom_access: '\Drupal\bible_admin\GroupAccess::access'
    group_id: '\d+'
    member_id: '\d+'

# The copy kept of an email sent to the group (group_message_copies; the "View" link in the Sent table).
bible_admin.group_sent_copy:
  path: '/admin/groups/{group_id}/sent/{message_id}'
  defaults:
    _controller: '\Drupal\bible_admin\Controller\GroupController::sentCopy'
    _title: 'Sent email'
  requirements:
    _custom_access: '\Drupal\bible_admin\GroupAccess::access'
    group_id: '\d+'
    message_id: '\d+'

bible_admin.group_schedule_add:
  path: '/admin/groups/{group_id}/schedules/add'
  defaults:
    _form: '\Drupal\bible_admin\Form\GroupScheduleForm'
    _title: 'Add a scheduled email'
  requirements:
    _custom_access: '\Drupal\bible_admin\GroupAccess::access'
    group_id: '\d+'

bible_admin.group_schedule_edit:
  path: '/admin/groups/{group_id}/schedules/{schedule_id}/edit'
  defaults:
    _form: '\Drupal\bible_admin\Form\GroupScheduleForm'
    _title: 'Change a scheduled email'
  requirements:
    _custom_access: '\Drupal\bible_admin\GroupAccess::access'
    group_id: '\d+'
    schedule_id: '\d+'

bible_admin.group_schedule_remove:
  path: '/admin/groups/{group_id}/schedules/{schedule_id}/remove'
  defaults:
    _form: '\Drupal\bible_admin\Form\RemoveGroupScheduleForm'
    _title: 'Remove a scheduled email'
  requirements:
    _custom_access: '\Drupal\bible_admin\GroupAccess::access'
    group_id: '\d+'
    schedule_id: '\d+'

# Send a test of a scheduled email to the group's leader only.
bible_admin.group_schedule_test:
  path: '/admin/groups/{group_id}/schedules/{schedule_id}/test'
  defaults:
    _form: '\Drupal\bible_admin\Form\TestGroupScheduleForm'
    _title: 'Send a test'
  requirements:
    _custom_access: '\Drupal\bible_admin\GroupAccess::access'
    group_id: '\d+'
    schedule_id: '\d+'

bible_admin.group_send:
  path: '/admin/groups/{group_id}/send/{kind}'
  defaults:
    _form: '\Drupal\bible_admin\Form\GroupSendForm'
    _title: 'Send to the group'
  requirements:
    _custom_access: '\Drupal\bible_admin\GroupAccess::access'
    group_id: '\d+'
    kind: 'message|verse|picture'

# The Admin guide (AdminGuideController, help/admin-guide.yml): open to anyone who can use one of this module's
# screens; each of its sections shows only to those who can use that screen.
bible_admin.guide:
  path: '/admin/guide'
  defaults:
    _controller: '\Drupal\bible_admin\Controller\AdminGuideController::build'
    _title: 'Admin guide'
  requirements:
    _permission: 'administer bibles+administer site settings+administer site users+administer faq notes+administer backups+lead groups+administer groups+keep signatures and tasks+administer signatures and tasks+use external sites'

# Backing up the whole site into a zip saved on the administrator's computer, and restoring it from one
# (site_backup.py). Restoring replaces Drupal's own database too, so it is for administrators only. The page
# is driven by js/backup.js through the JSON routes below; the ones that change anything are POST only and
# need the X-CSRF-Token header.
bible_admin.backup:
  path: '/admin/backup-restore'
  defaults:
    _controller: '\Drupal\bible_admin\Controller\BackupController::page'
    _title: 'Backup and restore'
  requirements:
    _permission: 'administer backups'

bible_admin.backup_status:
  path: '/admin/backup-restore/status'
  defaults:
    _controller: '\Drupal\bible_admin\Controller\BackupController::status'
  methods: [GET]
  requirements:
    _permission: 'administer backups'

bible_admin.backup_download:
  path: '/admin/backup-restore/download/{name}'
  defaults:
    _controller: '\Drupal\bible_admin\Controller\BackupController::download'
  methods: [GET]
  requirements:
    _permission: 'administer backups'
    name: 'bible-and-beyond-\d{4}-\d{2}-\d{2}-\d{6}(-bible-database|-drupal-database|-files)?\.zip'

bible_admin.backup_action:
  path: '/admin/backup-restore/{action}'
  defaults:
    _controller: '\Drupal\bible_admin\Controller\BackupController::act'
  methods: [POST]
  requirements:
    _permission: 'administer backups'
    _csrf_request_header_token: 'TRUE'
    action: 'start|discard|upload|restore|dismiss'

# Signatures and tasks (signatures.py, admin_tasks.py): each belongs to the Drupal user who made it. "keep signatures
# and tasks" (one's own) or "administer signatures and tasks" (everyone's); each signature's and task's pages also
# check that it is the user's own (SignatureTaskAccess) unless they administer all of them.
bible_admin.signatures:
  path: '/admin/signatures'
  defaults:
    _controller: '\Drupal\bible_admin\Controller\SignatureListController::build'
    _title: 'Signatures'
  requirements:
    _permission: 'keep signatures and tasks+administer signatures and tasks'

bible_admin.signature_add:
  path: '/admin/signatures/add'
  defaults:
    _form: '\Drupal\bible_admin\Form\SignatureForm'
    _title: 'Add a signature'
  requirements:
    _permission: 'keep signatures and tasks+administer signatures and tasks'

bible_admin.signature_edit:
  path: '/admin/signatures/{signature_id}/edit'
  defaults:
    _form: '\Drupal\bible_admin\Form\SignatureForm'
    _title: 'Change a signature'
  requirements:
    _custom_access: '\Drupal\bible_admin\SignatureTaskAccess::signature'
    signature_id: '\d+'

bible_admin.signature_delete:
  path: '/admin/signatures/{signature_id}/delete'
  defaults:
    _form: '\Drupal\bible_admin\Form\DeleteSignatureForm'
    _title: 'Delete a signature'
  requirements:
    _custom_access: '\Drupal\bible_admin\SignatureTaskAccess::signature'
    signature_id: '\d+'

bible_admin.tasks:
  path: '/admin/tasks'
  defaults:
    _controller: '\Drupal\bible_admin\Controller\TaskListController::build'
    _title: 'Tasks'
  requirements:
    _permission: 'keep signatures and tasks+administer signatures and tasks'

bible_admin.task_add:
  path: '/admin/tasks/add'
  defaults:
    _form: '\Drupal\bible_admin\Form\TaskForm'
    _title: 'Add a task'
  requirements:
    _permission: 'keep signatures and tasks+administer signatures and tasks'

bible_admin.task_edit:
  path: '/admin/tasks/{task_id}/edit'
  defaults:
    _form: '\Drupal\bible_admin\Form\TaskForm'
    _title: 'Change a task'
  requirements:
    _custom_access: '\Drupal\bible_admin\SignatureTaskAccess::task'
    task_id: '\d+'

bible_admin.task_delete:
  path: '/admin/tasks/{task_id}/delete'
  defaults:
    _form: '\Drupal\bible_admin\Form\DeleteTaskForm'
    _title: 'Delete a task'
  requirements:
    _custom_access: '\Drupal\bible_admin\SignatureTaskAccess::task'
    task_id: '\d+'

# Scheduled tasks (scheduled_tasks.py): a task given to a site user on one of its next four dates. Schedule beside a
# task opens the form for that task; each scheduled task is open to whoever may see its task.
bible_admin.scheduled_tasks:
  path: '/admin/scheduled-tasks'
  defaults:
    _controller: '\Drupal\bible_admin\Controller\ScheduledTaskListController::build'
    _title: 'Scheduled tasks'
  requirements:
    _permission: 'keep signatures and tasks+administer signatures and tasks'

# The Scheduled task report (2026-11-23, the owner's request, modelled on their paper sign-up sheet): the scheduled
# tasks between two dates, a section for each day, ready to print.
# Message a day: a message to the people scheduled on one date (DayMessageForm; 2026-11-23).
bible_admin.day_message:
  path: '/admin/scheduled-tasks/message'
  defaults:
    _form: '\Drupal\bible_admin\Form\DayMessageForm'
    _title: 'Message a day'
  requirements:
    _permission: 'keep signatures and tasks+administer signatures and tasks'

# Schedule tasks: several tasks on one date at once (ScheduleTasksForm; 2026-11-23).
bible_admin.scheduled_tasks_add:
  path: '/admin/scheduled-tasks/add'
  defaults:
    _form: '\Drupal\bible_admin\Form\ScheduleTasksForm'
    _title: 'Schedule tasks'
  requirements:
    _permission: 'keep signatures and tasks+administer signatures and tasks'

bible_admin.scheduled_task_report:
  path: '/admin/scheduled-tasks/report'
  defaults:
    _controller: '\Drupal\bible_admin\Controller\ScheduledTaskListController::report'
    _title: 'Scheduled Task Report'
  requirements:
    _permission: 'keep signatures and tasks+administer signatures and tasks'

bible_admin.task_schedule:
  path: '/admin/tasks/{task_id}/schedule'
  defaults:
    _form: '\Drupal\bible_admin\Form\ScheduledTaskForm'
    _title: 'Schedule a task'
  requirements:
    _custom_access: '\Drupal\bible_admin\SignatureTaskAccess::task'
    task_id: '\d+'

bible_admin.scheduled_task_edit:
  path: '/admin/scheduled-tasks/{schedule_id}/edit'
  defaults:
    _form: '\Drupal\bible_admin\Form\ScheduledTaskForm'
    _title: 'Change a scheduled task'
  requirements:
    _custom_access: '\Drupal\bible_admin\SignatureTaskAccess::schedule'
    schedule_id: '\d+'

bible_admin.scheduled_task_remove:
  path: '/admin/scheduled-tasks/{schedule_id}/remove'
  defaults:
    _form: '\Drupal\bible_admin\Form\RemoveScheduledTaskForm'
    _title: 'Remove a scheduled task'
  requirements:
    _custom_access: '\Drupal\bible_admin\SignatureTaskAccess::schedule'
    schedule_id: '\d+'

# External sites (external_sites.py): a shared list of sites, each opened in its own browser window (js/external-sites.js),
# never in a frame (Amazon refuses to show its sign-in inside another site).
bible_admin.external_sites:
