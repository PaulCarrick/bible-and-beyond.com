administer bibles:
  title: 'Administer Bibles, commentaries and devotionals'
  description: 'Upload, publish, hide and delete the Bible translations, commentaries and devotionals, and refresh the commentaries and devotionals from their sources.'
  restrict access: true

administer site users:
  title: 'Administer the main site users'
  description: 'List, add, change and delete the accounts of the public site''s visitors (not Drupal users), including their passwords.'
  restrict access: true

administer site settings:
  title: 'Administer the site settings'
  description: 'On the Site settings screen: the site title and copyright line, the email server and the keys of the outside services (Gemini, API.Bible, reCAPTCHA). Without it, only the verse-window numbers (with Administer Bibles).'
  restrict access: true

administer faq notes:
  title: 'Administer the FAQ notes'
  description: 'Add, change and delete the notes from the site owner shown under the FAQ answers on the public site.'
  restrict access: true

administer backups:
  title: 'Back up and restore the whole site'
  description: 'Save a backup zip of the databases (with the service keys) and the files (the music and Drupal''s files) to a folder on one''s own computer, and restore one. Restoring the database replaces Drupal''s too, its administrators included.'
  restrict access: true
