    <!-- Google tag (Google Ads, container GTM-PSTDLCSW), as Google gives it, but loaded only on the live site,
         so local testing and other people's installs of the containers do not report to this account. -->

      if (/^(www\.)?bible-and-beyond\.com$/.test(location.hostname)) {
        window.dataLayer = window.dataLayer || [];
        window.gtag = function(){dataLayer.push(arguments);};
        gtag('js', new Date());
        var googleTagScript = document.createElement('script');
        googleTagScript.async = true;
        googleTagScript.src = 'https://www.googletagmanager.com/gtm.js?id=GTM-PSTDLCSW';
        document.head.appendChild(googleTagScript);
      }
    </script>
