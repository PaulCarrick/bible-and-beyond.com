; PHP-FPM in the web container, for Drupal. Like deploy/php-fpm/, as the "site" user.
[stack]
user = site
group = site
listen = /run/php/stack-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 6
pm.process_idle_timeout = 30s
pm.max_requests = 500
; Drupal's settings (settings.local.php) read the database password and the rest from the environment.
clear_env = no
php_admin_value[memory_limit] = 256M
; 200 MB for the songs of the Christian music section (BibleManager::MAX_MUSIC_BYTES); the Bible and
; library uploads keep their own 15 MB limit in the forms.
php_admin_value[upload_max_filesize] = 200M
php_admin_value[post_max_size] = 210M
catch_workers_output = yes
decorate_workers_output = no
