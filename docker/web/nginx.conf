# nginx in the web container: the public site on port 80, the Drupal admin on port 8081.
# Like deploy/nginx/ (the same rate limits), without HTTPS: put a proxy that handles HTTPS in front
# (see docker/README.md).

# Behind such a proxy on a private network, take the visitor's address from X-Forwarded-For, so each
# visitor has their own limits. Requests from the internet come from public addresses and are not trusted.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Rate limits per visitor, as on the live site (deploy/nginx/bible-and-beyond-limits.conf).
map $args $licensed_client {
  default "";
  "~*translations=(NIV|NASB|MSG)" $binary_remote_addr;
}
limit_req_zone $binary_remote_addr zone=api_general:10m rate=5r/s;
limit_req_zone $licensed_client zone=api_licensed:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=api_contact:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=api_account:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_faq:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=cms_login:10m rate=10r/m;
limit_req_status 429;

server {
  listen 80 default_server;
  server_name _;
  root /app/frontend/dist;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location = /api/contact {
    limit_req zone=api_contact burst=3 nodelay;
    proxy_pass http://127.0.0.1:8000/contact;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 90s;
  }

  location ~ ^/api/account/(register|login|verify|resend-verification|forgot-password|reset-password)$ {
    limit_req zone=api_account burst=5 nodelay;
    proxy_pass http://127.0.0.1:8000/account/$1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 40s;
  }

  location = /api/subscriptions/unsubscribe {
    limit_req zone=api_account burst=5 nodelay;
    proxy_pass http://127.0.0.1:8000/subscriptions/unsubscribe$is_args$args;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  # The AI answers on the FAQ page can take a while.
  location ~ ^/api/faq/(answer|ask)$ {
    limit_req zone=api_faq burst=5 nodelay;
    proxy_pass http://127.0.0.1:8000/faq/$1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 90s;
  }

  location /api/ {
    limit_req zone=api_general burst=20 nodelay;
    limit_req zone=api_licensed burst=5 nodelay;
    proxy_pass http://127.0.0.1:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 40s;
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # Every page address (/help, /faq, ...) is the single-page site.
  location / {
    try_files $uri /index.html;
  }
}

server {
  listen 8081 default_server;
  server_name _;
  root /app/drupal/web;
  index index.php;
  client_max_body_size 16m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location ~ /\.(?!well-known) { deny all; }
  location ~ ^/(vendor|\.git)(/|$) { deny all; }
  location ~* \.(engine|inc|install|make|module|profile|po|sh|sql|theme|twig|xtmpl)$ { return 404; }
  location ~ ^/(composer\.(json|lock)|package\.json|yarn\.lock|web\.config)$ { return 404; }
  location ~ ^/sites/[^/]+/(private|settings|services) { deny all; }
  location ~ ^/sites/[^/]+/files/.*\.php$ { deny all; }
  location ~ ^/sites/[^/]+/files/styles/ { try_files $uri /index.php?$query_string; }

  # Slow down password guessing.
  location = /user/login {
    limit_req zone=cms_login burst=5 nodelay;
    try_files $uri /index.php?$query_string;
  }

  location / {
    try_files $uri /index.php?$query_string;
  }

  location ~ ^/(index|update)\.php(/|$) {
    fastcgi_split_path_info ^(.+?\.php)(|/.*)$;
    include fastcgi_params;
    fastcgi_param HTTP_PROXY "";
    # Debian's fastcgi_params passes the host without its port, so Drupal's redirects (after logging in)
    # would leave :8081 off. Drupal still checks the name against trusted_host_patterns.
    fastcgi_param HTTP_HOST $http_host;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO $fastcgi_path_info;
    fastcgi_param QUERY_STRING $query_string;
    fastcgi_intercept_errors on;
    fastcgi_read_timeout 300s;
    fastcgi_pass unix:/run/php/stack-fpm.sock;
  }

  # No other PHP file is run.
  location ~ \.php$ { return 404; }
}
