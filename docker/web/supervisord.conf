; Runs the three parts of the web container and restarts any that stops. Their output goes to the
; container's log (docker compose logs web).
[supervisord]
nodaemon = true
user = root
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /run/supervisord.pid

[program:nginx]
command = nginx -g "daemon off;"
autorestart = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:php-fpm]
command = php-fpm8.4 --nodaemonize --fpm-config /etc/php/8.4/fpm/php-fpm.conf
autorestart = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

; The Python service, as on the server (bible-and-beyond-ml.service).
[program:ml-service]
command = /app/ml-service/.venv/bin/uvicorn main:app --host 127.0.0.1 --port 8000
directory = /app/ml-service
user = site
environment = HOME="/home/site"
autorestart = true
startretries = 30
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

; The daily devotional emails, every 5 minutes, like the server's systemd timer
; (bible-and-beyond-devotional-emails.timer). Only one run sends at a time (a database lock).
[program:devotional-emails]
command = /bin/bash -c 'while true; do .venv/bin/python scripts/send_devotional_emails.py; sleep 300; done'
directory = /app/ml-service
user = site
environment = HOME="/home/site"
autorestart = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
