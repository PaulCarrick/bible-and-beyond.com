# Bible and Beyond in two containers (see docker/README.md):
#
#   cp docker/.env.example docker/.env      (then fill it in)
#   docker compose -f docker/compose.yml up -d
#
# The public site is served on SITE_PORT (80) and the Drupal admin on ADMIN_PORT (8081). The first start
# loads the Bible data and sets up Drupal with the administrator from docker/.env.
name: bible-and-beyond-stack

services:
  database:
    image: ${IMAGE_REGISTRY:-ghcr.io/paulcarrick}/bible-and-beyond-database:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/database/Dockerfile
    environment:
      POSTGRES_USER: bibleandbeyond
      POSTGRES_DB: bibleandbeyond
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env}
      DRUPAL_DATABASE_USER: drupal
      DRUPAL_DATABASE_PASSWORD: ${DRUPAL_DATABASE_PASSWORD:?Set DRUPAL_DATABASE_PASSWORD in docker/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - mariadb_data:/var/lib/mysql
    restart: unless-stopped

  web:
    image: ${IMAGE_REGISTRY:-ghcr.io/paulcarrick}/bible-and-beyond-web:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/web/Dockerfile
    depends_on:
      database:
        condition: service_healthy
    # The administrator, the email server, the service keys and the rest (see docker/.env.example).
    env_file: .env
    environment:
      DATABASE_URL: postgresql://bibleandbeyond:${POSTGRES_PASSWORD}@database:5432/bibleandbeyond
      DRUPAL_DATABASE_HOST: database
      DRUPAL_DATABASE_USER: drupal
      SITE_URL: ${SITE_URL:-http://localhost}
    ports:
      - "${SITE_PORT:-80}:80"
      - "${ADMIN_PORT:-8081}:8081"
    volumes:
      - drupal_files:/app/drupal/web/sites/default/files
      - drupal_private:/app/drupal-private
      - drupal_config:/app/drupal-config
      - service_data:/app/ml-service/data
    restart: unless-stopped

volumes:
  postgres_data:
  mariadb_data:
  drupal_files:
  drupal_private:
  drupal_config:
  service_data:
