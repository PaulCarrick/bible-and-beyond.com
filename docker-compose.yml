name: bible-and-beyond

services:
  database:
    image: pgvector/pgvector:pg17
    container_name: bible-and-beyond-database
    environment:
      POSTGRES_USER: bibleandbeyond
      POSTGRES_PASSWORD: bibleandbeyond
      POSTGRES_DB: bibleandbeyond
    ports:
      - "5434:5432"
    volumes:
      - database_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  database_data:
